    // --- AUDIO SYNTHESIS SYSTEM (WEB AUDIO API) ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type, duration, delay = 0) {
        if (this.muted) return;
        this.init();
        setTimeout(() => {
          try {
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gainNode.gain.setValueAtTime(0.12, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.005, this.ctx.currentTime + duration);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch (e) {
            console.warn("Audio Context playback error", e);
          }
        }, delay * 1000);
      }
      playSuccess() {
        this.playTone(523.25, 'sine', 0.12, 0); // C5
        this.playTone(659.25, 'sine', 0.12, 0.08); // E5
        this.playTone(783.99, 'sine', 0.25, 0.16); // G5
      }
      playError() {
        this.playTone(220, 'triangle', 0.18, 0); // A3
        this.playTone(180, 'triangle', 0.25, 0.08); // F3
      }
      playTick() {
        this.playTone(880, 'sine', 0.015, 0); // High tick
      }
      playJoin() {
        this.playTone(392, 'sine', 0.08, 0); // G4
        this.playTone(523.25, 'sine', 0.18, 0.06); // C5
      }
      playFanfare() {
        this.playTone(261.63, 'sine', 0.15, 0); // C4
        this.playTone(329.63, 'sine', 0.15, 0.08); // E4
        this.playTone(392.00, 'sine', 0.15, 0.16); // G4
        this.playTone(523.25, 'sine', 0.4, 0.24); // C5
      }
    }

        return <HostScreen user={user} authReady={authReady} isMuted={isMuted} setIsMuted={setIsMuted} localMode={localMode} goBack={() => setRole('select')} />;
      }

      if (role === 'player') {
        return <PlayerScreen user={user} authReady={authReady} isMuted={isMuted} setIsMuted={setIsMuted} localMode={localMode} goBack={() => setRole('select')} />;
      }

      return null;
    }

    // ==========================================
    // 1. WELCOME SCREEN
    // ==========================================
    function WelcomeScreen({ setRole, isMuted, setIsMuted }) {
      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 md:p-12 relative overflow-hidden font-sans">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_60%_50%_at_50%_0%,#1c1917_0%,transparent_100%)] opacity-40 ambient-glow" />

          <header className="z-10 flex justify-between items-center w-full border-b border-stone-900 pb-6">
            <div className="flex items-center gap-3">
              <div className="bg-amber-500 text-stone-950 px-2.5 py-1.5 rounded-lg font-bold font-serif text-sm">
                JW
              </div>
              <div>
                <h1 className="text-md font-bold tracking-widest text-stone-200 uppercase font-serif">Joyce Wang Studio</h1>
                <p className="text-[10px] text-amber-500/80 uppercase tracking-widest font-semibold font-mono">Interactive Game Suite</p>
              </div>
            </div>

            <button 
              onClick={() => setIsMuted(!isMuted)} 
              className="text-stone-400 hover:text-stone-200 p-2 border border-stone-800 rounded-lg hover:bg-stone-900/60 transition-colors"
            >
              {isMuted ? <VolumeX className="w-5 h-5" /> : <Volume2 className="w-5 h-5" />}
            </button>
          </header>

          <main className="z-10 flex-1 flex flex-col justify-center items-center py-12 max-w-4xl mx-auto text-center gap-8">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-amber-500/20 bg-amber-950/20 text-amber-400 text-xs tracking-wider uppercase font-mono">
              <Sparkles className="w-3.5 h-3.5" /> Live Multiplayer Office Battle
            </div>

            <div className="space-y-4">
              <h2 className="text-4xl md:text-7xl font-light tracking-tight text-white leading-tight font-serif">
                The Ultimate <br />
                <span className="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">
                  Design & People
                </span> Quiz
              </h2>
              <p className="text-stone-400 text-sm md:text-md max-w-2xl mx-auto font-light leading-relaxed">
                A premium, real-time battle of spatial intelligence, material recognition, and studio camaraderie. Beautifully crafted with custom vector blueprints and peer-consensus voting modules.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mt-4">
              <button 
                onClick={() => { sfx.playJoin(); setRole('host'); }}
                className="group relative flex flex-col justify-between items-start text-left p-6 rounded-2xl bg-stone-900/40 border border-amber-500/10 hover:border-amber-500/30 hover:bg-stone-900/80 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1"
              >
                <div className="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full filter blur-xl group-hover:bg-amber-500/10 transition-colors" />
                <div className="p-3 bg-amber-500/10 rounded-xl text-amber-500 mb-6 group-hover:bg-amber-500 group-hover:text-stone-950 transition-colors">
                  <Layout className="w-6 h-6" />
                </div>
                <div>
                  <span className="text-[10px] font-mono tracking-widest text-amber-500 uppercase font-semibold">Presentation Screen</span>
                  <h3 className="text-xl font-bold text-white mt-1 group-hover:text-amber-300 transition-colors font-serif">Host Master View</h3>
                  <p className="text-stone-400 text-xs mt-2 font-light leading-relaxed">
                    Broadcast the live presentation. Generates a QR code for smartphone connectivity, displaying real-time tallies, design SVGs, and the grand final podium.
                  </p>
                </div>
                <div className="mt-6 flex items-center gap-2 text-xs font-semibold text-amber-400 uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                  Launch Presenter <ArrowRight className="w-4 h-4" />
                </div>
              </button>

              <button 
                onClick={() => { sfx.playJoin(); setRole('player'); }}
                className="group relative flex flex-col justify-between items-start text-left p-6 rounded-2xl bg-stone-900/40 border border-stone-800 hover:border-amber-500/20 hover:bg-stone-900/80 hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-1"
              >
                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-500/5 rounded-full filter blur-xl group-hover:bg-emerald-500/10 transition-colors" />
                <div className="p-3 bg-stone-800 rounded-xl text-stone-300 mb-6 group-hover:bg-emerald-500 group-hover:text-stone-950 transition-colors">
                  <Users className="w-6 h-6" />
                </div>
                <div>
                  <span className="text-[10px] font-mono tracking-widest text-stone-400 uppercase font-semibold">Mobile Controller</span>
                  <h3 className="text-xl font-bold text-white mt-1 group-hover:text-emerald-300 transition-colors font-serif">Join as Player</h3>
                  <p className="text-stone-400 text-xs mt-2 font-light leading-relaxed">
                    Connect and lock in your project trivia responses. Vote for peers dynamically during the customized "Most Likely To" poll segments.
                  </p>
                </div>
                <div className="mt-6 flex items-center gap-2 text-xs font-semibold text-emerald-400 uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                  Connect Controller <ArrowRight className="w-4 h-4" />
                </div>
              </button>
            </div>
          </main>

          <footer className="z-10 border-t border-stone-900 pt-6 text-center text-xs text-stone-500 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>© 2026 Joyce Wang Studio Interactive Event Suite.</p>
            <p className="font-mono text-[10px] text-amber-500/60 uppercase tracking-widest">Aesthetic Precision & Real-Time Sync</p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 2. HOST SCREEN (LIVE TV / SCREEN VIEW)
    // ==========================================
    function HostScreen({ user, authReady, isMuted, setIsMuted, localMode, goBack }) {
      const [gameState, setGameState] = useState(null);
      const [players, setPlayers] = useState([]);
      
      const [customMembers, setCustomMembers] = useState(() => {
        const saved = localStorage.getItem('jw_quiz_custom_members');
        return saved ? JSON.parse(saved) : ["Joyce", "Rachel", "Sonal", "David", "Fiona", "Clement", "Yuki", "Marco", "Iris"];
      });
      const [newMemberName, setNewMemberName] = useState("");

      const [timerLeft, setTimerLeft] = useState(25);
      const timerIntervalRef = useRef(null);
      const [showOverrideInput, setShowOverrideInput] = useState(false);
      const [joinLinkOverride, setJoinLinkOverride] = useState("");
      
      // Safety safeguard state for header instant-reset module
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      // Database Paths (Strict Compliance with RULE 1)
      const gameDocRef = !isPlaceholderConfig && db ? db.doc(`artifacts/${appId}/public/data/games/lobby`) : null;
      const playersColRef = !isPlaceholderConfig && db ? db.collection(`artifacts/${appId}/public/data/players`) : null;

      // --- LOCAL STATE BACKUPS (For database testing & previews) ---
      const [localGameState, setLocalGameState] = useState({
        status: 'setup',
        currentQuestionIndex: 0,
        questionStartTime: 0,
        membersList: customMembers
      });
      const [localPlayers, setLocalPlayers] = useState([
        { id: '1', name: 'RACHEL W.', score: 320, currentAnswer: '' },
        { id: '2', name: 'SONAL M.', score: 450, currentAnswer: '' },
        { id: '3', name: 'DAVID F.', score: 210, currentAnswer: '' },
        { id: '4', name: 'CLEMENT T.', score: 510, currentAnswer: '' }
      ]);

      useEffect(() => {
        localStorage.setItem('jw_quiz_custom_members', JSON.stringify(customMembers));
      }, [customMembers]);

      // --- FIRESTORE SUBSCRIPTIONS (RULE 3 Compliance) ---
      useEffect(() => {
        if (!authReady || !user || isPlaceholderConfig) return;

        const unsubGame = gameDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setGameState(snapshot.data());
          } else {
            const initialSetup = {
              status: 'setup',
              currentQuestionIndex: 0,
              questionStartTime: 0,
              membersList: customMembers
            };
            gameDocRef.set(initialSetup);
            setGameState(initialSetup);
          }
        }, (err) => {
          console.error("Firestore Game state error:", err);
        });

        const unsubPlayers = playersColRef.onSnapshot((snapshot) => {
          const playersList = [];
          snapshot.forEach((doc) => {
            playersList.push({ id: doc.id, ...doc.data() });
          });
          setPlayers(playersList);
        }, (err) => {
          console.error("Firestore Players load error:", err);
        });

        return () => {
          unsubGame();
          unsubPlayers();
        };
      }, [user, authReady]);

      // Fallback state mapping
      const currentGameState = isPlaceholderConfig ? localGameState : gameState;
      const currentPlayers = isPlaceholderConfig ? localPlayers : players;

      // Timer Logic
      useEffect(() => {
        if (currentGameState && currentGameState.status === 'playing') {
          sfx.playTick();
          setTimerLeft(25);
          
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
          
          timerIntervalRef.current = setInterval(() => {
            setTimerLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timerIntervalRef.current);
                revealAnswers();
                return 0;
              }
              if (prev <= 6) {
                sfx.playTone(600, 'sine', 0.08);
              } else {
                sfx.playTone(400, 'sine', 0.03);
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        }

        return () => {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        };
      }, [currentGameState?.status, currentGameState?.currentQuestionIndex]);

      const handleAddMember = () => {
        if (!newMemberName.trim()) return;
        const nameClean = newMemberName.trim();
        if (customMembers.includes(nameClean)) return;
        setCustomMembers([...customMembers, nameClean]);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        setCustomMembers(customMembers.filter(m => m !== name));
      };

      const createLobby = async () => {
        sfx.playSuccess();
        const data = {
          status: 'lobby',
          currentQuestionIndex: 0,
          questionStartTime: Date.now(),
          membersList: customMembers
        };
        if (isPlaceholderConfig) {
          setLocalGameState(data);
        } else {
          await gameDocRef.set(data);
        }
      };

      const clearPlayers = async () => {
        sfx.playError();
        if (isPlaceholderConfig) {
          setLocalPlayers([]);
        } else {
          for (const player of currentPlayers) {
            await playersColRef.doc(player.id).delete();
          }
        }
      };

      const startGame = async () => {
        sfx.playSuccess();
        const startState = {
          status: 'playing',
          currentQuestionIndex: 0,
          questionStartTime: Date.now()
        };
        if (isPlaceholderConfig) {
          setLocalGameState(prev => ({ ...prev, ...startState }));
          setLocalPlayers(prev => prev.map(p => ({ ...p, score: 0, currentAnswer: '' })));
        } else {
          await gameDocRef.update(startState);
          for (const p of currentPlayers) {
            await playersColRef.doc(p.id).update({
              currentAnswer: "",
              score: 0
            });
          }
        }
      };

      const revealAnswers = async () => {
        if (!currentGameState) return;
        sfx.playSuccess();

        const qIndex = currentGameState.currentQuestionIndex ?? 0;
        const currentQuestion = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        let updatedPlayers = [...currentPlayers];

        if (currentQuestion.type === 'project') {
          // Normal Trivia scoring with speed modifiers
          for (const p of updatedPlayers) {
            if (p.currentAnswer === currentQuestion.answer) {
              const speedBonus = p.answeredAt ? Math.max(10, Math.floor(40 - (p.answeredAt - currentGameState.questionStartTime) / 1000)) : 0;
              const pointsEarned = 100 + speedBonus;
              p.score = (p.score || 0) + pointsEarned;
              
              if (!isPlaceholderConfig) {
                await playersColRef.doc(p.id).update({ score: p.score });
              }
            }
          }
        } else {
          // Consensus voting scoring
          const voteCounts = {};
          updatedPlayers.forEach(p => {
            if (p.currentAnswer) {
              voteCounts[p.currentAnswer] = (voteCounts[p.currentAnswer] || 0) + 1;
            }
          });

          let topVotedPerson = "";
          let maxVotes = 0;
          Object.entries(voteCounts).forEach(([person, count]) => {
            if (count > maxVotes) {
              maxVotes = count;
              topVotedPerson = person;
            }
          });

          if (topVotedPerson) {
            for (const p of updatedPlayers) {
              if (p.currentAnswer === topVotedPerson) {
                p.score = (p.score || 0) + 120;
                if (!isPlaceholderConfig) {
                  await playersColRef.doc(p.id).update({ score: p.score });
                }
              }
            }
          }
        }

        if (isPlaceholderConfig) {
          setLocalPlayers(updatedPlayers);
          setLocalGameState(prev => ({ ...prev, status: 'showing_answer' }));
        } else {
          await gameDocRef.update({ status: 'showing_answer' });
        }
      };

      const nextQuestion = async () => {
        if (!currentGameState) return;
        const nextIdx = (currentGameState.currentQuestionIndex ?? 0) + 1;

        if (nextIdx < QUIZ_QUESTIONS.length) {
          sfx.playJoin();
          if (isPlaceholderConfig) {
            setLocalPlayers(prev => prev.map(p => ({ ...p, currentAnswer: '' })));
            setLocalGameState(prev => ({
              ...prev,
              currentQuestionIndex: nextIdx,
              status: 'playing',
              questionStartTime: Date.now()
            }));
          } else {
            for (const p of currentPlayers) {
              await playersColRef.doc(p.id).update({ currentAnswer: "" });
            }
            await gameDocRef.update({
              currentQuestionIndex: nextIdx,
              status: 'playing',
              questionStartTime: Date.now()
            });
          }
        } else {
          sfx.playFanfare();
          if (isPlaceholderConfig) {
            setLocalGameState(prev => ({ ...prev, status: 'leaderboard' }));
          } else {
            await gameDocRef.update({ status: 'leaderboard' });
          }
        }
      };

      const resetGameToSetup = async () => {
        if (isPlaceholderConfig) {
          setLocalGameState({
            status: 'setup',
            currentQuestionIndex: 0,
            questionStartTime: 0,
            membersList: customMembers
          });
          setLocalPlayers([]);
        } else {
          await gameDocRef.update({
            status: 'setup',
            currentQuestionIndex: 0
          });
          await clearPlayers();
        }
      };

      const origin = window.location.origin;
      const rawJoinUrl = `${origin}${window.location.pathname}?role=player`;
      const joinUrl = joinLinkOverride.trim() !== "" ? joinLinkOverride.trim() : rawJoinUrl;
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=1c1917&bgcolor=ffffff&data=${encodeURIComponent(joinUrl)}`;

      if (!currentGameState) {
        return (
          <div className="min-h-screen bg-stone-950 flex flex-col justify-center items-center text-white">
            <RefreshCw className="w-8 h-8 text-amber-500 animate-spin mb-4" />
            <p className="text-sm font-mono tracking-widest text-stone-400">CONNECTING TO JOYCE WANG CLOUD NODE...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 p-6 md:p-12 relative overflow-hidden flex flex-col justify-between font-sans">
          <div className="absolute inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_50%,#1c1917_0%,transparent_100%)] opacity-30 ambient-glow" />

          {/* Header */}
          <header className="z-10 flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-stone-900 pb-4 gap-4">
            <div className="flex items-center gap-4">
              <div className="bg-amber-500 text-stone-950 font-black px-3 py-2 rounded-lg font-serif text-md">JW</div>
              <div>
                <span className="text-xs text-amber-500 tracking-widest font-mono uppercase font-semibold">Joyce Wang Master Suite</span>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold tracking-wider font-serif text-white uppercase">LIVE HOST PORTAL</h1>
                  {isPlaceholderConfig ? (
                    <span className="bg-indigo-500/10 border border-indigo-500/20 px-2 py-0.5 rounded text-[9px] text-indigo-400 font-mono tracking-wider uppercase font-bold">Local Preview Active</span>
                  ) : (
                    <span className="bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded text-[9px] text-emerald-400 font-mono tracking-wider uppercase font-bold">Live Synchronized</span>
                  )}
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setIsMuted(!isMuted)} 
                className="p-2 border border-stone-800 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-white"
                title="Toggle Mute"
              >
                {isMuted ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4" />}
              </button>

              {/* Instant Restart Quiz Mechanism (Enabled once Lobby is created) */}
              {currentGameState.status !== 'setup' && (
                <div className="relative">
                  {showResetConfirm ? (
                    <div className="flex items-center gap-1.5 bg-stone-900 border border-red-500/40 px-2.5 py-1.5 rounded-lg text-xs font-mono">
                      <span className="text-red-400 font-bold uppercase tracking-wider text-[9px]">CONFIRM RESET?</span>
                      <button 
                        onClick={async () => {
                          await resetGameToSetup();
                          setShowResetConfirm(false);
                        }}
                        className="bg-red-500 text-stone-950 font-extrabold px-2 py-0.5 rounded text-[9px] uppercase tracking-wider hover:bg-red-400 transition-colors"
                      >
                        YES
                      </button>
                      <button 
                        onClick={() => setShowResetConfirm(false)}
                        className="bg-stone-800 text-stone-300 px-2 py-0.5 rounded text-[9px] uppercase tracking-wider hover:bg-stone-700 transition-colors"
                      >
                        NO
                      </button>
                    </div>
                  ) : (
                    <button 
                      onClick={() => setShowResetConfirm(true)}
                      className="text-[10px] text-red-400 hover:text-red-300 px-3 py-2 border border-red-950 rounded-lg font-mono hover:bg-red-950/20 transition-colors uppercase font-bold"
                    >
                      RESTART QUIZ
                    </button>
                  )}
                </div>
              )}

              <button 
                onClick={goBack} 
                className="text-[10px] text-stone-400 hover:text-white px-3 py-2 border border-stone-800 rounded-lg font-mono hover:bg-stone-900 transition-colors"
              >
                QUIT PRESENTING
              </button>
            </div>
          </header>

          {/* Main Workspace Frame */}
          <main className="z-10 my-8 flex-1 flex flex-col justify-center">
            
            {/* Step 1: Cast Registration Screen */}
            {currentGameState.status === 'setup' && (
              <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                <div className="space-y-6">
                  <span className="text-xs font-mono text-amber-500 tracking-widest uppercase font-semibold">01 / Studio Cast Deployment</span>
                  <h2 className="text-4xl font-light text-white leading-tight font-serif">
                    Configure Your <br />
                    <span className="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">Active Team Roster</span>
                  </h2>
                  <p className="text-stone-400 text-sm leading-relaxed">
                    Verify and populate the exact list of designers, project managers, and directors participating today. This generates customized peer vote options dynamically across connected mobile screens.
                  </p>

                  <div className="bg-stone-900/60 border border-stone-800 p-5 rounded-2xl space-y-4">
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        placeholder="Add member (e.g. Clement)" 
                        value={newMemberName} 
                        onChange={e => setNewMemberName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleAddMember()}
                        className="flex-1 bg-stone-950 border border-stone-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 font-mono"
                      />
                      <button 
                        onClick={handleAddMember}
                        className="bg-amber-500 hover:bg-amber-600 text-stone-950 px-5 rounded-xl text-xs font-mono tracking-wider uppercase font-bold flex items-center gap-1.5 transition-colors"
                      >
                        <Plus className="w-4 h-4" /> Add Cast
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2">
                      {customMembers.map((name, idx) => (
                        <span 
                          key={idx} 
                          className="inline-flex items-center gap-1.5 px-3 py-1 bg-stone-950 text-amber-400 text-xs font-mono rounded-lg border border-amber-500/15"
                        >
                          {name}
                          <button onClick={() => handleRemoveMember(name)} className="text-stone-500 hover:text-red-400 transition-colors">
                            <Trash2 className="w-3 h-3" />
                          </button>
                        </span>
                      ))}
                      {customMembers.length === 0 && (
                        <p className="text-xs text-stone-500 italic py-2">Cast list is empty. Add names above.</p>
                      )}
                    </div>
                  </div>

                  <button 
                    onClick={createLobby}
                    disabled={customMembers.length === 0}
                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 disabled:opacity-40 disabled:pointer-events-none hover:from-amber-600 hover:to-amber-700 text-stone-950 font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-md font-serif"
                  >
                    Open Active Game Lobby <ChevronRight className="w-5 h-5" />
                  </button>
                </div>

                <div className="hidden lg:block bg-stone-900/40 border border-stone-800 p-8 rounded-3xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full filter blur-2xl" />
                  <h3 className="text-xs font-serif font-semibold text-amber-500 mb-4 uppercase tracking-widest">Architectural Game Breakdown</h3>
                  <ul className="space-y-4 text-xs text-stone-300">
                    <li className="flex gap-3">
                      <div className="p-1.5 bg-amber-500/10 rounded text-amber-500 h-fit"><Info className="w-4 h-4" /></div>
                      <p><strong>15 Project Blueprints:</strong> Identify custom lighting structures, natural inspirations, and iconic material combinations behind major Joyce Wang Masterpieces.</p>
                    </li>
                    <li className="flex gap-3">
                      <div className="p-1.5 bg-amber-500/10 rounded text-amber-500 h-fit"><Users className="w-4 h-4" /></div>
                      <p><strong>15 Peer Votes:</strong> Dynamic nominations computed in real-time. Alignment with the studio majority yields massive bonus points!</p>
                    </li>
                  </ul>
                </div>
              </div>
            )}

            {/* Step 2: Lobby Screen (Scannable QR Connection) */}
            {currentGameState.status === 'lobby' && (
              <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div className="lg:col-span-5 flex flex-col items-center text-center bg-stone-900 border border-stone-800 p-6 rounded-3xl relative">
                  <div className="absolute top-3 left-3 bg-amber-500/10 border border-amber-500/20 text-amber-400 px-3 py-1 rounded-lg text-[9px] font-mono uppercase tracking-wider font-semibold">
                    SCAN TO CONNECT
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-2xl mt-8 border border-stone-800">
                    <img 
                      src={qrCodeUrl} 
                      alt="Connection QR Code" 
                      className="w-56 h-56 md:w-64 md:h-64 object-contain"
                    />
                  </div>

                  <div className="mt-6 w-full space-y-3">
                    <p className="text-[10px] font-mono text-stone-500 uppercase tracking-widest font-semibold">Controller Link Options:</p>
                    
                    <div className="bg-stone-950 p-3.5 rounded-xl border border-stone-800 text-left">
                      <div className="flex justify-between items-center">
                        <span className="text-[9px] font-mono text-amber-500 tracking-wider font-semibold">BROADCAST URL</span>
                        <button 
                          onClick={() => setShowOverrideInput(!showOverrideInput)}
                          className="text-[9px] text-stone-500 hover:text-amber-400 flex items-center gap-1 font-mono uppercase font-semibold"
                        >
                          <Edit2 className="w-3 h-3" /> {showOverrideInput ? "Lock" : "Edit URL"}
                        </button>
                      </div>

                      {showOverrideInput ? (
                        <div className="space-y-2 mt-2">
                          <input 
                            type="text"
                            value={joinLinkOverride}
                            placeholder={rawJoinUrl}
                            onChange={(e) => setJoinLinkOverride(e.target.value)}
                            className="w-full bg-stone-900 border border-stone-700 rounded px-2.5 py-1.5 text-xs text-stone-200 focus:outline-none focus:border-amber-500 font-mono"
                          />
                        </div>
                      ) : (
                        <p className="text-[11px] font-semibold text-amber-500 font-mono select-all truncate mt-1">
                          {joinUrl}
                        </p>
                      )}
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-6">
                  <div className="flex justify-between items-end">
                    <div>
                      <span className="text-xs font-mono text-amber-500 tracking-widest uppercase font-semibold font-mono">Real-Time Sync Queue</span>
                      <h2 className="text-3xl font-serif font-light text-white mt-1">Ready for Deployment...</h2>
                    </div>
                    <div className="bg-stone-900 border border-stone-800 px-4 py-2 rounded-xl text-right">
                      <span className="text-[9px] text-stone-500 font-mono block uppercase font-semibold">PLAYERS JOINED</span>
                      <span className="text-2xl font-bold text-amber-500 font-mono">{currentPlayers.length}</span>
                    </div>
                  </div>

                  <div className="bg-stone-900/40 border border-stone-800/80 rounded-2xl p-6 min-h-[16rem] max-h-[18rem] overflow-y-auto">
                    {currentPlayers.length === 0 ? (
                      <div className="h-full flex flex-col justify-center items-center text-stone-500 gap-3 py-12">
                        <UserPlus className="w-8 h-8 text-stone-600" />
                        <p className="text-xs font-mono tracking-wider uppercase font-semibold">Waiting for mobile units to scan...</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {currentPlayers.map((p, idx) => (
                          <div 
                            key={idx} 
                            className="flex items-center gap-2.5 bg-stone-950 border border-stone-850 p-3 rounded-xl shadow-md"
                          >
                            <div className="w-2 h-2 bg-emerald-500 rounded-full animate-pulse" />
                            <span className="text-xs font-bold text-stone-200 truncate font-mono uppercase tracking-wider">{p.name}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex gap-4">
                    <button 
                      onClick={clearPlayers}
                      className="px-6 py-4 border border-red-500/20 hover:bg-red-950/20 text-red-400 rounded-xl text-xs font-mono tracking-wider font-semibold transition-colors uppercase"
                    >
                      Clear All
                    </button>
                    <button 
                      onClick={startGame}
                      disabled={currentPlayers.length === 0}
                      className="flex-1 bg-amber-500 hover:bg-amber-600 disabled:opacity-40 disabled:hover:bg-amber-500 text-stone-950 font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-xs font-mono tracking-widest uppercase font-bold"
                    >
                      <Play className="w-4 h-4" strokeWidth="3" /> Commence Showdown
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* Step 3: Question Display Frame */}
            {currentGameState.status === 'playing' && (() => {
              const qIndex = currentGameState.currentQuestionIndex ?? 0;
              const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
              const answeredCount = currentPlayers.filter(p => p.currentAnswer !== undefined && p.currentAnswer !== "").length;

              return (
                <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-stretch">
                  <div className="lg:col-span-7 flex flex-col justify-between space-y-6">
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-mono text-amber-500 tracking-widest uppercase bg-amber-950/20 border border-amber-500/20 px-3 py-1 rounded-full font-bold font-mono">
                          BLUEPRINT {qIndex + 1} OF 30
                        </span>
                        <span className={`text-[9px] font-mono px-3 py-1 rounded-full border font-bold tracking-wider uppercase ${q.type === 'project' ? 'border-amber-500/20 text-amber-400 bg-amber-950/20' : 'border-emerald-500/20 text-emerald-400 bg-emerald-950/20'}`}>
                          {q.type === 'project' ? 'STUDIO MASTERPIECE' : 'PEOPLE & CULTURE POLL'}
                        </span>
                      </div>
                      <h2 className="text-xl md:text-3xl font-serif text-white leading-snug mt-4 font-normal">
                        {q.type === 'project' ? q.question : `Who is most likely to ${q.prompt}`}
                      </h2>
                    </div>

                    {q.type === 'project' ? (
                      <ProjectIllustration type={q.svgType} />
                    ) : (
                      <div className="w-full h-48 md:h-64 rounded-xl flex flex-col items-center justify-center bg-stone-900/60 border border-emerald-500/10 relative overflow-hidden">
                        <Users className="w-12 h-12 text-emerald-500/20 mb-2" />
                        <span className="text-[10px] font-mono text-emerald-400 uppercase tracking-widest font-semibold">Studio Peer Nomination Poll</span>
                        <p className="text-stone-500 text-xs mt-2 max-w-sm text-center font-light leading-relaxed">Cast a confidential vote for your colleague on your mobile controller. Alignment with the studio majority secures consensus points!</p>
                      </div>
                    )}

                    <div className="flex items-center justify-between bg-stone-900/80 border border-stone-850 p-4 rounded-xl">
                      <div className="flex items-center gap-3">
                        <div className="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" />
                        <span className="text-xs font-mono text-stone-300">
                          SUBMISSIONS RECEIVED: <strong className="text-amber-400 text-sm font-bold">{answeredCount}</strong> OF <strong className="text-stone-400 text-sm">{currentPlayers.length}</strong>
                        </span>
                      </div>

                      <button 
                        onClick={revealAnswers}
                        className="bg-amber-500 hover:bg-amber-600 text-stone-950 px-4 py-2 rounded-lg text-xs font-mono font-bold tracking-widest uppercase transition-all"
                      >
                        REVEAL
                      </button>
                    </div>
                  </div>

                  <div className="lg:col-span-5 flex flex-col justify-between bg-stone-900/40 border border-stone-800 p-8 rounded-3xl relative">
                    <div className="flex flex-col items-center justify-center my-6">
                      <div className="relative w-28 h-28 flex items-center justify-center">
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                          <circle cx="50" cy="50" r="45" fill="none" stroke="#292524" strokeWidth="6" />
                          <circle 
                            cx="50" 
                            cy="50" 
                            r="45" 
                            fill="none" 
                            stroke="#f59e0b" 
                            strokeWidth="6" 
                            strokeDasharray="283"
                            strokeDashoffset={283 - (283 * timerLeft) / 25}
                            className="transition-all duration-1000 ease-linear"
                          />
                        </svg>
                        <div className="text-center z-10">
                          <span className="text-3xl font-mono font-bold text-white">{timerLeft}</span>
                          <span className="block text-[8px] font-mono text-stone-500 uppercase tracking-widest">SECONDS</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-3 mt-4">
                      {q.type === 'project' ? (
                        q.options.map((opt, idx) => {
                          const labels = ['A', 'B', 'C', 'D'];
                          return (
                            <div key={idx} className="flex items-center gap-3 bg-stone-950/80 border border-stone-850 p-3.5 rounded-xl">
                              <span className="w-6 h-6 flex items-center justify-center bg-stone-900 border border-stone-800 text-amber-500 font-mono rounded text-xs font-semibold">{labels[idx]}</span>
                              <span className="text-xs font-semibold text-stone-300">{opt}</span>
                            </div>
                          );
                        })
                      ) : (
                        <div className="p-4 bg-stone-950/60 border border-stone-850 rounded-xl text-center">
                          <p className="text-[9px] text-emerald-400 font-mono tracking-widest uppercase mb-1 font-bold">REALTIME POPULATION</p>
                          <p className="text-stone-500 text-xs font-light">The complete cast list loaded inside Step 1 is populated on mobile controllers dynamically.</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            {/* Step 4: Reveal and Explanation Screen */}
            {currentGameState.status === 'showing_answer' && (() => {
              const qIndex = currentGameState.currentQuestionIndex ?? 0;
              const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
              
              const voteStats = {};
              currentPlayers.forEach(p => {
                if (p.currentAnswer) {
                  voteStats[p.currentAnswer] = (voteStats[p.currentAnswer] || 0) + 1;
                }
              });

              return (
                <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-stretch">
                  <div className="lg:col-span-7 flex flex-col justify-between space-y-6">
                    <div>
                      <span className="text-[10px] font-mono text-emerald-400 tracking-widest uppercase bg-emerald-950/20 border border-emerald-500/20 px-3 py-1 rounded-full font-bold">
                        VERIFICATION LOG
                      </span>
                      {q.type === 'project' ? (
                        <div className="space-y-2 mt-4">
                          <span className="text-xs text-stone-500 font-mono uppercase block font-semibold font-mono">CORRECT BLUEPRINT:</span>
                          <h2 className="text-4xl font-bold font-serif text-amber-400">{q.answer}</h2>
                          <p className="text-stone-300 text-sm leading-relaxed mt-4 bg-stone-900/40 border border-stone-800 p-5 rounded-xl">
                            {q.explanation}
                          </p>
                        </div>
                      ) : (
                        <div className="space-y-2 mt-4">
                          <span className="text-xs text-stone-500 font-mono uppercase block font-semibold font-mono">STUDIO MAJORITY DECISION:</span>
                          <h2 className="text-3xl font-bold font-serif text-emerald-400 leading-snug">
                            {Object.keys(voteStats).length > 0 
                              ? `Consensus: ${Object.entries(voteStats).sort((a,b)=>b[1]-a[1])[0][0]}`
                              : "No answers received."}
                          </h2>
                          <p className="text-stone-400 text-xs mt-2 font-light">Every player aligned with this majority is rewarded 120 consensus points!</p>
                        </div>
                      )}
                    </div>

                    {q.type === 'project' && <ProjectIllustration type={q.svgType} />}
                  </div>

                  <div className="lg:col-span-5 flex flex-col justify-between bg-stone-900/40 border border-stone-800 p-8 rounded-3xl">
                    <div>
                      <h3 className="text-xs font-mono font-bold text-stone-400 tracking-wider mb-6 uppercase border-b border-stone-800 pb-2">Statistical Distribution</h3>
                      
                      <div className="space-y-4">
                        {q.type === 'project' ? (
                          q.options.map((opt, idx) => {
                            const count = currentPlayers.filter(p => p.currentAnswer === opt).length;
                            const percentage = currentPlayers.length > 0 ? (count / currentPlayers.length) * 100 : 0;
                            const isCorrect = opt === q.answer;

                            return (
                              <div key={idx} className="space-y-1">
                                <div className="flex justify-between text-xs font-mono">
                                  <span className={isCorrect ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                                    {opt} {isCorrect && '✓'}
                                  </span>
                                  <span className="text-stone-300">{count} ({Math.round(percentage)}%)</span>
                                </div>
                                <div className="w-full bg-stone-950 h-1.5 rounded-full overflow-hidden border border-stone-850">
                                  <div 
                                    className={`h-full rounded-full transition-all duration-1000 ${isCorrect ? 'bg-amber-500' : 'bg-stone-700'}`}
                                    style={{ width: `${percentage}%` }}
                                  />
                                </div>
                              </div>
                            );
                          })
                        ) : (
                          Object.keys(voteStats).length > 0 ? (
                            Object.entries(voteStats).sort((a,b) => b[1] - a[1]).map(([name, count], idx) => {
                              const percentage = currentPlayers.length > 0 ? (count / currentPlayers.length) * 100 : 0;
                              return (
                                <div key={idx} className="space-y-1">
                                  <div className="flex justify-between text-xs font-mono">
                                    <span className="text-stone-300 font-medium">{name}</span>
                                    <span className="text-emerald-400 font-bold">{count} votes ({Math.round(percentage)}%)</span>
                                  </div>
                                  <div className="w-full bg-stone-950 h-1.5 rounded-full overflow-hidden border border-stone-850">
                                    <div 
                                      className="h-full rounded-full bg-emerald-500 transition-all duration-1000"
                                      style={{ width: `${percentage}%` }}
                                    />
                                  </div>
                                </div>
                              );
                            })
                          ) : (
                            <p className="text-xs text-stone-500 italic text-center py-6 font-mono">No submissions captured.</p>
                          )
                        )}
                      </div>
                    </div>

                    <button 
                      onClick={nextQuestion}
                      className="w-full bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold py-4 rounded-xl mt-8 transition-all flex items-center justify-center gap-2 text-xs font-mono tracking-widest uppercase font-bold"
                    >
                      {qIndex + 1 < QUIZ_QUESTIONS.length ? 'Next Question' : 'Deploy Final Podium'} <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>
                </div>
              );
            })()}

            {/* Step 5: Master Leaderboard Podium */}
            {currentGameState.status === 'leaderboard' && (() => {
              const rankedPlayers = [...currentPlayers].sort((a, b) => (b.score || 0) - (a.score || 0));
              const gold = rankedPlayers[0];
              const silver = rankedPlayers[1];
              const bronze = rankedPlayers[2];

              return (
                <div className="max-w-4xl mx-auto w-full space-y-12">
                  <div className="text-center space-y-2">
                    <span className="text-xs font-mono text-amber-500 tracking-widest uppercase font-semibold font-mono">Assessment Complete</span>
                    <h2 className="text-5xl font-serif font-light text-white leading-tight">THE GRAND PODIUM</h2>
                    <p className="text-stone-400 text-sm font-light">Honoring design intelligence and cultural consensus.</p>
                  </div>

                  <div className="flex items-end justify-center gap-4 pt-16 border-b border-stone-900 pb-8">
                    {silver && (
                      <div className="flex flex-col items-center">
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-stone-300 block max-w-28 truncate">{silver.name}</span>
                          <span className="text-xs text-stone-500 font-mono">{silver.score || 0} pts</span>
                        </div>
                        <div className="w-28 bg-gradient-to-t from-stone-900 to-stone-800/40 h-32 rounded-t-xl flex flex-col items-center justify-center border-t border-stone-700">
                          <span className="text-4xl font-extrabold text-stone-400 font-serif">2</span>
                          <span className="text-[8px] text-stone-500 font-mono uppercase tracking-widest font-bold">SILVER</span>
                        </div>
                      </div>
                    )}

                    {gold && (
                      <div className="flex flex-col items-center scale-110 -translate-y-4">
                        <Award className="w-8 h-8 text-amber-500 mb-1" />
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-amber-300 block max-w-28 truncate">{gold.name}</span>
                          <span className="text-xs text-amber-400 font-mono font-bold">{gold.score || 0} pts</span>
                        </div>
                        <div className="w-32 bg-gradient-to-t from-stone-900 to-stone-800/80 h-44 rounded-t-xl flex flex-col items-center justify-center border-t-2 border-amber-500 relative shadow-2xl">
                          <span className="text-5xl font-black text-amber-500 font-serif">1</span>
                          <span className="text-[8px] text-amber-400 font-mono uppercase tracking-widest font-bold">GOLD</span>
                        </div>
                      </div>
                    )}

                    {bronze && (
                      <div className="flex flex-col items-center">
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-amber-600 block max-w-28 truncate">{bronze.name}</span>
                          <span className="text-xs text-stone-500 font-mono">{bronze.score || 0} pts</span>
                        </div>
                        <div className="w-28 bg-gradient-to-t from-stone-900 to-stone-800/40 h-24 rounded-t-xl flex flex-col items-center justify-center border-t border-stone-800">
                          <span className="text-3xl font-extrabold text-amber-700 font-serif">3</span>
                          <span className="text-[8px] text-stone-500 font-mono uppercase tracking-widest font-bold">BRONZE</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="max-w-2xl mx-auto space-y-2 max-h-48 overflow-y-auto pr-2">
                    {rankedPlayers.slice(3).map((p, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-stone-900/40 border border-stone-850 px-5 py-3 rounded-xl">
                        <div className="flex items-center gap-3">
                          <span className="text-xs font-mono text-stone-500">#{idx + 4}</span>
                          <span className="text-xs font-bold text-stone-200 font-mono uppercase tracking-wider">{p.name}</span>
                        </div>
                        <span className="text-xs font-mono text-amber-500 font-bold">{p.score || 0} PTS</span>
                      </div>
                    ))}
                  </div>

                  <div className="text-center">
                    <button 
                      onClick={resetGameToSetup}
                      className="bg-stone-900 border border-stone-800 hover:bg-stone-850 hover:border-amber-500/20 px-8 py-3.5 rounded-xl text-[10px] font-mono tracking-widest uppercase transition-colors font-bold"
                    >
                      RESET SYSTEM FOR NEXT SESSION
                    </button>
                  </div>
                </div>
              );
            })()}
          </main>

          {/* Footer */}
          <footer className="z-10 border-t border-stone-900 pt-4 flex flex-col sm:flex-row justify-between items-center gap-2 text-[10px] text-stone-600">
            <p>Joyce Wang Studio Realtime Event Service • Custom UMD Core</p>
            {currentGameState.status !== 'setup' && (
              <p className="font-mono text-amber-500/80 font-semibold tracking-wider font-mono">WORKSPACE TOKEN: {appId}</p>
            )}
          </footer>
        </div>
      );
    }

    // ==========================================
    // 3. PLAYER CONTROLLER SCREEN
    // ==========================================
    function PlayerScreen({ user, authReady, isMuted, setIsMuted, goBack }) {
      const [playerId, setPlayerId] = useState(null);
      const [playerName, setPlayerName] = useState("");
      const [joined, setJoined] = useState(false);
      const [myPlayerDoc, setMyPlayerDoc] = useState(null);
      const [gameState, setGameState] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      // Database Paths (Strict Compliance with RULE 1)
      const gameDocRef = !isPlaceholderConfig && db ? db.doc(`artifacts/${appId}/public/data/games/lobby`) : null;

      // --- LOCAL BACKUPS ---
      const [localGameState, setLocalGameState] = useState({
        status: 'lobby',
        currentQuestionIndex: 0,
        membersList: ["Joyce", "Rachel", "Sonal", "David", "Fiona", "Clement", "Yuki", "Marco", "Iris"]
      });
      const [localMyPlayer, setLocalMyPlayer] = useState({
        name: 'LOCAL TESTER',
        score: 0,
        currentAnswer: ''
      });

      useEffect(() => {
        if (!authReady || !user) return;
        setPlayerId(user.uid);

        if (isPlaceholderConfig) return;

        const unsubGame = gameDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setGameState(snapshot.data());
          }
        }, (err) => {
          console.error("Player lobby sync error:", err);
        });

        return () => unsubGame();
      }, [user, authReady]);

      useEffect(() => {
        if (!authReady || !user || !playerId || isPlaceholderConfig) return;

        const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
        const unsubMyPlayer = myDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setMyPlayerDoc(snapshot.data());
            setJoined(true);
          } else {
            setJoined(false);
          }
        }, (err) => {
          console.error("Player doc loading error:", err);
        });

        return () => unsubMyPlayer();
      }, [user, authReady, playerId]);

      const currentGameState = isPlaceholderConfig ? localGameState : gameState;
      const currentMyPlayer = isPlaceholderConfig ? localMyPlayer : myPlayerDoc;

      const handleJoinGame = async (e) => {
        e.preventDefault();
        const nameClean = playerName.trim().toUpperCase();
        if (!nameClean || (!isPlaceholderConfig && !playerId)) return;

        setSubmitting(true);
        sfx.playJoin();

        if (isPlaceholderConfig) {
          setLocalMyPlayer(prev => ({ ...prev, name: nameClean }));
          setJoined(true);
          setSubmitting(false);
        } else {
          try {
            const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
            await myDocRef.set({
              name: nameClean,
              score: 0,
              currentAnswer: "",
              joinedAt: Date.now()
            });
            setJoined(true);
          } catch (err) {
            console.error("Error writing player document:", err);
          } finally {
            setSubmitting(false);
          }
        }
      };

      const selectOption = async (optValue) => {
        if (!isPlaceholderConfig && (!playerId || !currentGameState || currentMyPlayer?.currentAnswer)) return;
        if (isPlaceholderConfig && currentMyPlayer?.currentAnswer) return;

        sfx.playSuccess();

        if (isPlaceholderConfig) {
          setLocalMyPlayer(prev => ({ ...prev, currentAnswer: optValue }));
        } else {
          try {
            const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
            await myDocRef.update({
              currentAnswer: optValue,
              answeredAt: Date.now()
            });
          } catch (err) {
            console.error("Error submitting selection:", err);
          }
        }
      };

      if (!currentGameState) {
        return (
          <div className="min-h-screen bg-stone-950 flex flex-col justify-center items-center text-stone-100 p-6">
            <RefreshCw className="w-8 h-8 text-amber-500 animate-spin mb-4" />
            <p className="text-sm font-mono tracking-widest text-stone-400 text-center">WAITING FOR HOST TO CONFIGURE ROOM...</p>
          </div>
        );
      }

      // Connectivity / Log-in State
      if (!joined) {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_50%,#1c1917_0%,transparent_100%)] opacity-30 ambient-glow" />

            <header className="z-10 flex justify-between items-center border-b border-stone-900 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">Mobile Portal</span>
              </div>
              <button onClick={goBack} className="text-[10px] text-stone-500 hover:text-white font-mono uppercase tracking-widest font-semibold">
                Back
              </button>
            </header>

            <main className="z-10 flex-1 flex flex-col justify-center max-w-sm mx-auto w-full py-12">
              <div className="space-y-6 text-center">
                <div className="w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-500 flex items-center justify-center rounded-2xl mx-auto">
                  <QrCodeIcon className="w-6 h-6" />
                </div>

                <div className="space-y-2">
                  <h2 className="text-2xl font-serif text-white font-normal">Connect Controller</h2>
                  <p className="text-stone-400 text-xs font-light font-sans">Enter your name or professional initials to register inside the presenter's active roster.</p>
                </div>

                <form onSubmit={handleJoinGame} className="space-y-4 pt-2">
                  <div className="space-y-1.5 text-left">
                    <label className="text-[9px] font-mono text-amber-500 uppercase tracking-widest font-bold">NICKNAME / IDENTITY</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. SONAL W."
                      maxLength={14}
                      value={playerName}
                      onChange={e => setPlayerName(e.target.value)}
                      className="w-full bg-stone-900 border border-stone-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500 font-mono"
                    />
                  </div>

                  <button 
                    type="submit"
                    disabled={submitting || !playerName.trim()}
                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-stone-950 font-bold py-3.5 rounded-xl transition-all shadow-lg hover:shadow-amber-500/10 flex items-center justify-center gap-2 font-mono text-xs tracking-widest uppercase font-bold"
                  >
                    {submitting ? 'Connecting...' : 'DEPLOY INTERFACE'} <ArrowRight className="w-4 h-4" />
                  </button>
                </form>
              </div>
            </main>

            <footer className="z-10 text-center text-[9px] text-stone-700 tracking-wider font-mono">
              Joyce Wang Studio • Secure real-time controller node
            </footer>
          </div>
        );
      }

      // Lobby / Ready Stage
      if (currentGameState.status === 'lobby' || currentGameState.status === 'setup') {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-900 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-[10px] font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{currentMyPlayer?.name}</span>
              </div>
              <span className="text-[8px] text-emerald-500 bg-emerald-950/20 border border-emerald-500/20 px-2.5 py-0.5 rounded-full font-mono uppercase tracking-widest font-bold">
                CONNECTED
              </span>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto gap-4">
              <div className="w-14 h-14 bg-stone-900 border border-stone-850 rounded-2xl flex items-center justify-center text-amber-500 mx-auto animate-pulse">
                <Clock className="w-6 h-6" />
              </div>
              <h2 className="text-lg font-serif text-white font-normal">Sync Confirmed!</h2>
              <p className="text-stone-400 text-xs font-light leading-relaxed font-sans">Keep this terminal window open. Once the presenter commences the battle, question modules will instantaneously materialize below.</p>
              
              <div className="bg-stone-900/60 border border-stone-850 rounded-xl p-4 mt-4 text-left">
                <span className="text-[8px] font-mono text-stone-500 uppercase tracking-widest block mb-1 font-bold">MY METRICS</span>
                <div className="flex justify-between items-center text-xs">
                  <span className="text-stone-300 font-bold font-mono text-sm">{currentMyPlayer?.name}</span>
                  <span className="text-amber-500 font-mono font-bold">0 POINTS</span>
                </div>
              </div>
            </main>

            <footer className="text-center text-[9px] text-stone-700 font-mono">
              ROOM IDENTIFIER: {appId}
            </footer>
          </div>
        );
      }

      // Active Question Stage
      if (currentGameState.status === 'playing') {
        const qIndex = currentGameState.currentQuestionIndex ?? 0;
        const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        const hasAnswered = currentMyPlayer?.currentAnswer !== "";

        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-900 pb-4">
              <div className="flex items-center gap-2">
                <span className="text-[9px] font-mono font-bold text-amber-500 bg-amber-950/20 px-2 py-0.5 rounded border border-amber-500/10 font-mono">B-{q.id}</span>
                <span className="text-xs font-serif font-bold text-stone-300 truncate max-w-28 uppercase">{currentMyPlayer?.name}</span>
              </div>
              <div className="text-right">
                <span className="text-[8px] text-stone-500 font-mono block font-bold">SCORE</span>
                <span className="text-xs font-mono font-bold text-amber-500">{currentMyPlayer?.score || 0}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center py-6">
              {hasAnswered ? (
                <div className="text-center space-y-4 max-w-sm mx-auto">
                  <div className="w-14 h-14 bg-emerald-500/10 border border-emerald-500/25 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto animate-bounce">
                    <CheckCircle className="w-6 h-6" />
                  </div>
                  <h3 className="text-lg font-bold text-white font-serif font-normal font-serif">Selection Locked!</h3>
                  <p className="text-xs text-stone-400 font-light leading-relaxed">Your response has been parsed and logged. Watch the presenter screen for verification!</p>
                  
                  <div className="p-4 bg-stone-900 border border-stone-850 rounded-xl text-left">
                    <span className="text-[8px] font-mono text-stone-500 uppercase tracking-widest block mb-1 font-bold">MY SELECTION:</span>
                    <span className="text-xs font-bold text-amber-500 font-mono">{currentMyPlayer.currentAnswer}</span>
                  </div>
                </div>
              ) : (
                <div className="space-y-6">
                  <div className="text-center">
                    <span className="text-[9px] text-amber-500 font-mono tracking-widest uppercase block mb-1 font-bold">MAKE SELECTION</span>
                    <p className="text-stone-300 text-xs font-light">Determine the correct blueprint or nominate your colleague below:</p>
                  </div>

                  {q.type === 'project' ? (
                    <div className="grid grid-cols-1 gap-3 max-w-md mx-auto">
                      {q.options.map((opt, idx) => {
                        const letters = ['A', 'B', 'C', 'D'];
                        return (
                          <button 
                            key={idx}
                            onClick={() => selectOption(opt)}
                            className="w-full text-left flex items-center gap-4 bg-stone-900 hover:bg-stone-850 border border-stone-850 hover:border-amber-500/30 p-4 rounded-xl transition-all active:scale-95 duration-100"
                          >
                            <span className="w-6 h-6 flex items-center justify-center bg-stone-950 border border-stone-800 text-amber-500 rounded text-[11px] font-bold font-mono font-mono">
                              {letters[idx]}
                            </span>
                            <span className="text-xs font-bold text-stone-350">{opt}</span>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="space-y-3 max-w-md mx-auto">
                      <span className="text-[9px] text-emerald-400 font-mono uppercase tracking-widest block text-center mb-1 font-bold">STUDIO CAST DIRECTORY:</span>
                      <div className="grid grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">
                        {(currentGameState.membersList || []).map((name, idx) => (
                          <button 
                            key={idx}
                            onClick={() => selectOption(name)}
                            className="bg-stone-900 hover:bg-stone-850 border border-stone-850 hover:border-emerald-500/20 p-3 rounded-xl text-xs font-bold font-mono text-stone-300 hover:text-emerald-400 text-center truncate uppercase tracking-wider active:scale-95 duration-100"
                          >
                            {name}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="text-center text-[9px] text-stone-700 font-mono">
              Awaiting host reveal actions...
            </footer>
          </div>
        );
      }

      // Showing Answer Stage
      if (currentGameState.status === 'showing_answer') {
        const qIndex = currentGameState.currentQuestionIndex ?? 0;
        const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        const isCorrect = q.type === 'project' && currentMyPlayer?.currentAnswer === q.answer;

        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-900 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{currentMyPlayer?.name}</span>
              </div>
              <div className="text-right">
                <span className="text-[8px] text-stone-500 font-mono block font-bold">LATEST SCORE</span>
                <span className="text-xs font-mono font-bold text-amber-500">{currentMyPlayer?.score || 0}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto space-y-6">
              {q.type === 'project' ? (
                isCorrect ? (
                  <div className="space-y-4">
                    <div className="w-14 h-14 bg-emerald-500/10 border border-emerald-500/25 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto">
                      <Trophy className="w-6 h-6" />
                    </div>
                    <h2 className="text-xl font-serif text-emerald-400 font-bold tracking-wide font-serif">VERIFIED CORRECT!</h2>
                    <p className="text-xs text-stone-400 font-light font-sans">Your speed assessment was accurate. Points added successfully.</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="w-14 h-14 bg-red-500/10 border border-red-500/25 text-red-500 flex items-center justify-center rounded-2xl mx-auto">
                      <Info className="w-6 h-6" />
                    </div>
                    <h2 className="text-xl font-serif text-red-400 font-bold tracking-wide font-serif">INCORRECT ANALYSIS</h2>
                    <p className="text-xs text-stone-400 font-light leading-relaxed">The verified blueprint answer was <strong className="text-amber-500 font-bold">{q.answer}</strong>.</p>
                  </div>
                )
              ) : (
                <div className="space-y-4">
                  <div className="w-14 h-14 bg-emerald-500/10 border border-emerald-500/25 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto">
                    <Users className="w-6 h-6" />
                  </div>
                  <h2 className="text-xl font-serif text-emerald-400 font-bold tracking-wide font-serif">VOTE LOGGED</h2>
                  <p className="text-xs text-stone-400 font-light leading-relaxed font-sans">If your vote matched the studio majority consensus, you received 120 extra points!</p>
                </div>
              )}

              <div className="bg-stone-900 border border-stone-850 rounded-2xl p-5 text-left space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="text-stone-500 font-mono uppercase font-bold text-[9px]">MY SUBMISSION:</span>
                  <span className="text-white font-bold font-mono">{currentMyPlayer?.currentAnswer || "N/A"}</span>
                </div>
                {q.type === 'project' && (
                  <div className="flex justify-between items-center text-xs pt-2 border-t border-stone-800">
                    <span className="text-stone-500 font-mono uppercase font-bold text-[9px]">VERIFIED ANSWER:</span>
                    <span className="text-amber-500 font-bold font-mono">{q.answer}</span>
                  </div>
                )}
              </div>
            </main>

            <footer className="text-center text-[9px] text-stone-700 font-mono">
              Prepare for the next configuration on presenter screen...
            </footer>
          </div>
        );
      }

      // Leaderboard Completed Stage
      if (currentGameState.status === 'leaderboard') {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-900 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{currentMyPlayer?.name}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto space-y-4">
              <div className="w-14 h-14 bg-gradient-to-br from-amber-400 to-amber-600 text-stone-950 flex items-center justify-center rounded-2xl mx-auto shadow-lg">
                <Award className="w-6 h-6" strokeWidth="2.5" />
              </div>
              <h2 className="text-xl font-serif text-white font-semibold">BATTLE CONCLUDED!</h2>
              <p className="text-xs text-stone-400 font-light leading-relaxed">Thank you for demonstrating your studio architectural intelligence! Consult the main screen to locate your overall rank on the grand podium.</p>

              <div className="bg-stone-900 border border-stone-850 rounded-2xl p-5 text-left">
                <span className="text-[8px] font-mono text-stone-500 uppercase tracking-widest block mb-1 font-bold">MY RECORD</span>
                <div className="flex justify-between items-center text-sm">
                  <span className="text-stone-300 font-bold font-mono">{currentMyPlayer?.name}</span>
                  <span className="text-amber-500 font-bold font-mono text-lg">{currentMyPlayer?.score || 0} PTS</span>
                </div>
              </div>
            </main>

            <footer className="text-center text-[9px] text-stone-700 tracking-wider">
              Joyce Wang Studio • Aesthetic Mastery
            </footer>
          </div>
        );
      }

      return null;
    }

    // Mount React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
