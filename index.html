    // --- AUDIO SYNTHESIS SYSTEM (Web Audio API) ---
    class SoundManager {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playTone(freq, type, duration, delay = 0) {
        if (this.muted) return;
        this.init();
        setTimeout(() => {
          try {
            const osc = this.ctx.createOscillator();
            const gainNode = this.ctx.createGain();
            osc.connect(gainNode);
            gainNode.connect(this.ctx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gainNode.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
          } catch (e) {
            console.warn("Sound play error", e);
          }
        }, delay * 1000);
      }
      playSuccess() {
        this.playTone(523.25, 'sine', 0.15, 0); // C5
        this.playTone(659.25, 'sine', 0.15, 0.1); // E5
        this.playTone(783.99, 'sine', 0.3, 0.2); // G5
      }
      playError() {
        this.playTone(220, 'triangle', 0.2, 0); // A3
        this.playTone(180, 'triangle', 0.3, 0.1); // F3
      }
      playTick() {
        this.playTone(880, 'sine', 0.02, 0); // High tick
      }
      playJoin() {
        this.playTone(392, 'sine', 0.1, 0); // G4
        this.playTone(523.25, 'sine', 0.2, 0.08); // C5
      }
      playFanfare() {
        this.playTone(261.63, 'square', 0.2, 0); // C4
        this.playTone(329.63, 'square', 0.2, 0.1); // E4
        this.playTone(392.00, 'square', 0.2, 0.2); // G4
        this.playTone(523.25, 'square', 0.5, 0.3); // C5
      }
    }
    const sfx = new SoundManager();

            <div className="flex items-center gap-3">
              <div className="bg-amber-500 text-stone-950 p-2 rounded-lg font-bold tracking-tighter font-serif">
                JW
              </div>
              <div>
                <h1 className="text-lg font-bold tracking-widest text-stone-200 uppercase font-serif">Joyce Wang Studio</h1>
                <p className="text-xs text-amber-500/80 uppercase tracking-widest">Interactive Game Show</p>
              </div>
            </div>

            <button 
              onClick={() => setIsMuted(!isMuted)} 
              className="text-stone-400 hover:text-stone-200 p-2 border border-stone-800 rounded-lg hover:bg-stone-900 transition-colors"
            >
              {isMuted ? <VolumeX /> : <Volume2 />}
            </button>
          </header>

          <main className="z-10 flex-1 flex flex-col justify-center items-center py-12 max-w-4xl mx-auto text-center gap-8">
            <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-amber-500/30 bg-amber-950/20 text-amber-400 text-xs tracking-wider uppercase font-mono">
              <Sparkles /> Live Multiplayer Office Quiz
            </div>

            <div className="space-y-4">
              <h2 className="text-4xl md:text-7xl font-light tracking-tight text-white leading-tight font-serif">
                The Ultimate <br />
                <span className="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">
                  Design & People
                </span> Quiz
              </h2>
              <p className="text-stone-400 text-sm md:text-lg max-w-2xl mx-auto font-light leading-relaxed">
                A premium real-time battle of architectural intelligence, project recall, and studio camaraderie. Perfect for office events, featuring <span className="text-amber-400 font-medium">30 interactive questions</span> split between iconic Joyce Wang Studio projects and hilarious peer-voting.
              </p>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl mt-4">
              <button 
                onClick={() => { sfx.playJoin(); setRole('host'); }}
                className="group relative flex flex-col justify-between items-start text-left p-6 rounded-2xl bg-gradient-to-br from-stone-900 to-stone-950 border border-amber-500/20 hover:border-amber-500/50 hover:shadow-2xl hover:shadow-amber-950/20 transition-all duration-300 transform hover:-translate-y-1"
              >
                <div className="absolute top-0 right-0 w-24 h-24 bg-amber-500/5 rounded-full filter blur-xl group-hover:bg-amber-500/10 transition-colors" />
                <div className="p-3 bg-amber-500/10 rounded-xl text-amber-500 mb-6 group-hover:bg-amber-500 group-hover:text-stone-950 transition-colors">
                  <Layout />
                </div>
                <div>
                  <span className="text-xs font-mono tracking-widest text-amber-500 uppercase">Large Screen Presentation</span>
                  <h3 className="text-xl font-bold text-white mt-1 group-hover:text-amber-300 transition-colors">Host Live Screen</h3>
                  <p className="text-stone-400 text-xs mt-2 font-light">
                    Launch the master lobby. Generates a QR Code for team members to scan and displays live questions, illustrations, response tallies, and the leaderboard podium.
                  </p>
                </div>
                <div className="mt-6 flex items-center gap-2 text-xs font-semibold text-amber-400 uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                  Launch Presenter <ArrowRight />
                </div>
              </button>

              <button 
                onClick={() => { sfx.playJoin(); setRole('player'); }}
                className="group relative flex flex-col justify-between items-start text-left p-6 rounded-2xl bg-gradient-to-br from-stone-900 to-stone-950 border border-stone-800 hover:border-amber-500/30 hover:shadow-2xl hover:shadow-emerald-950/10 transition-all duration-300 transform hover:-translate-y-1"
              >
                <div className="absolute top-0 right-0 w-24 h-24 bg-emerald-500/5 rounded-full filter blur-xl group-hover:bg-emerald-500/10 transition-colors" />
                <div className="p-3 bg-stone-800 rounded-xl text-stone-300 mb-6 group-hover:bg-emerald-500 group-hover:text-stone-950 transition-colors">
                  <Users />
                </div>
                <div>
                  <span className="text-xs font-mono tracking-widest text-stone-400 uppercase">Mobile Controller</span>
                  <h3 className="text-xl font-bold text-white mt-1 group-hover:text-emerald-300 transition-colors">Join as Player</h3>
                  <p className="text-stone-400 text-xs mt-2 font-light">
                    Join a live game hosted on the office screen. Select responses, lock-in project guesses, and vote for your colleagues in real-time "Most Likely To" questions.
                  </p>
                </div>
                <div className="mt-6 flex items-center gap-2 text-xs font-semibold text-emerald-400 uppercase tracking-wider group-hover:translate-x-2 transition-transform">
                  Connect Controller <ArrowRight />
                </div>
              </button>
            </div>
          </main>

          <footer className="z-10 border-t border-stone-900 pt-6 text-center text-xs text-stone-500 flex flex-col md:flex-row justify-between items-center gap-4">
            <p>© 2026 Joyce Wang Studio Interactive Suite.</p>
          </footer>
        </div>
      );
    }

    // ==========================================
    // 2. HOST SCREEN (LIVE TV / SCREEN VIEW)
    // ==========================================
    function HostScreen({ user, isMuted, setIsMuted, localMode, goBack }) {
      const [gameState, setGameState] = useState(null);
      const [players, setPlayers] = useState([]);
      
      // BLANK STUDIO MEMBER REGISTRATION BY DEFAULT
      const [customMembers, setCustomMembers] = useState([]);
      const [newMemberName, setNewMemberName] = useState("");

      const [loading, setLoading] = useState(true);
      const [timerLeft, setTimerLeft] = useState(25);
      const timerIntervalRef = useRef(null);
      const [showOverrideInput, setShowOverrideInput] = useState(false);
      const [joinLinkOverride, setJoinLinkOverride] = useState("");

      // Database Paths formatted strictly under RULE 1
      const gameDocRef = db.doc(`artifacts/${appId}/public/data/games/lobby`);
      const playersColRef = db.collection(`artifacts/${appId}/public/data/players`);

      useEffect(() => {
        if (!user) return;

        const unsubGame = gameDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setGameState(snapshot.data());
            setLoading(false);
          } else {
            const initialSetup = {
              status: 'setup',
              currentQuestionIndex: 0,
              questionStartTime: 0,
              membersList: []
            };
            gameDocRef.set(initialSetup);
            setGameState(initialSetup);
            setLoading(false);
          }
        }, (err) => {
          console.error("Firestore Game state error:", err);
          setLoading(false);
        });

        const unsubPlayers = playersColRef.onSnapshot((snapshot) => {
          const playersList = [];
          snapshot.forEach((doc) => {
            playersList.push({ id: doc.id, ...doc.data() });
          });
          setPlayers(playersList);
        }, (err) => {
          console.error("Firestore Players load error:", err);
        });

        return () => {
          unsubGame();
          unsubPlayers();
        };
      }, [user]);

      useEffect(() => {
        if (gameState && gameState.status === 'playing') {
          sfx.playTick();
          setTimerLeft(25);
          
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
          
          timerIntervalRef.current = setInterval(() => {
            setTimerLeft((prev) => {
              if (prev <= 1) {
                clearInterval(timerIntervalRef.current);
                revealAnswers();
                return 0;
              }
              if (prev <= 6) {
                sfx.playTone(600, 'sine', 0.08);
              } else {
                sfx.playTone(400, 'sine', 0.03);
              }
              return prev - 1;
            });
          }, 1000);
        } else {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        }

        return () => {
          if (timerIntervalRef.current) clearInterval(timerIntervalRef.current);
        };
      }, [gameState?.status, gameState?.currentQuestionIndex]);

      const handleAddMember = () => {
        if (!newMemberName.trim()) return;
        if (customMembers.includes(newMemberName.trim())) return;
        setCustomMembers([...customMembers, newMemberName.trim()]);
        setNewMemberName("");
      };

      const handleRemoveMember = (name) => {
        setCustomMembers(customMembers.filter(m => m !== name));
      };

      const createLobby = async () => {
        sfx.playSuccess();
        await gameDocRef.set({
          status: 'lobby',
          currentQuestionIndex: 0,
          questionStartTime: Date.now(),
          membersList: customMembers
        });
      };

      const clearPlayers = async () => {
        sfx.playError();
        for (const player of players) {
          await playersColRef.doc(player.id).delete();
        }
      };

      const startGame = async () => {
        sfx.playSuccess();
        await gameDocRef.update({
          status: 'playing',
          currentQuestionIndex: 0,
          questionStartTime: Date.now()
        });
        for (const p of players) {
          await playersColRef.doc(p.id).update({
            currentAnswer: "",
            score: 0
          });
        }
      };

      const revealAnswers = async () => {
        if (!gameState) return;
        sfx.playSuccess();

        const qIndex = gameState.currentQuestionIndex ?? 0;
        const currentQuestion = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        let updatedPlayers = [...players];

        if (currentQuestion.type === 'project') {
          for (const p of updatedPlayers) {
            if (p.currentAnswer === currentQuestion.answer) {
              const speedBonus = p.answeredAt ? Math.max(10, Math.floor(40 - (p.answeredAt - gameState.questionStartTime) / 1000)) : 0;
              const pointsEarned = 100 + speedBonus;
              
              await playersColRef.doc(p.id).update({
                score: (p.score || 0) + pointsEarned
              });
            }
          }
        } else {
          const voteCounts = {};
          updatedPlayers.forEach(p => {
            if (p.currentAnswer) {
              voteCounts[p.currentAnswer] = (voteCounts[p.currentAnswer] || 0) + 1;
            }
          });

          let topVotedPerson = "";
          let maxVotes = 0;
          Object.entries(voteCounts).forEach(([person, count]) => {
            if (count > maxVotes) {
              maxVotes = count;
              topVotedPerson = person;
            }
          });

          if (topVotedPerson) {
            for (const p of updatedPlayers) {
              if (p.currentAnswer === topVotedPerson) {
                await playersColRef.doc(p.id).update({
                  score: (p.score || 0) + 120
                });
              }
            }
          }
        }

        await gameDocRef.update({
          status: 'showing_answer'
        });
      };

      const nextQuestion = async () => {
        if (!gameState) return;
        const nextIdx = (gameState.currentQuestionIndex ?? 0) + 1;

        if (nextIdx < QUIZ_QUESTIONS.length) {
          sfx.playJoin();
          for (const p of players) {
            await playersColRef.doc(p.id).update({
              currentAnswer: ""
            });
          }

          await gameDocRef.update({
            currentQuestionIndex: nextIdx,
            status: 'playing',
            questionStartTime: Date.now()
          });
        } else {
          sfx.playFanfare();
          await gameDocRef.update({
            status: 'leaderboard'
          });
        }
      };

      const resetGameToSetup = async () => {
        await gameDocRef.update({
          status: 'setup',
          currentQuestionIndex: 0
        });
        await clearPlayers();
      };

      const origin = window.location.origin;
      const rawJoinUrl = `${origin}${window.location.pathname}?role=player`;
      const joinUrl = joinLinkOverride.trim() !== "" ? joinLinkOverride.trim() : rawJoinUrl;

      // Scan-optimized scannable QR Code
      const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&color=1c1917&bgcolor=ffffff&data=${encodeURIComponent(joinUrl)}`;

      if (loading || !gameState) {
        return (
          <div className="min-h-screen bg-stone-950 flex flex-col justify-center items-center text-white">
            <RefreshCw className="w-8 h-8 text-amber-500 animate-spin mb-4" />
            <p className="text-sm font-mono tracking-widest text-stone-400">CONNECTING REALTIME HUB DATABASE...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-stone-950 text-stone-100 p-6 md:p-12 relative overflow-hidden flex flex-col justify-between font-sans">
          <div className="absolute inset-0 bg-[linear-gradient(to_right,#1c1917_1px,transparent_1px),linear-gradient(to_bottom,#1c1917_1px,transparent_1px)] bg-[size:5rem_5rem] opacity-20" />

          <header className="z-10 flex justify-between items-center border-b border-stone-800 pb-4">
            <div className="flex items-center gap-4">
              <div className="bg-amber-500 text-stone-950 font-black p-2.5 rounded-lg font-serif">JW</div>
              <div>
                <span className="text-xs text-amber-500 tracking-widest font-mono uppercase">Joyce Wang Studio Quiz</span>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl font-bold tracking-wider font-serif text-white uppercase">LIVE HOST PORTAL</h1>
                  <span className="bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded text-[10px] text-emerald-400 font-mono tracking-wider uppercase">Live Database Online</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setIsMuted(!isMuted)} 
                className="p-2 border border-stone-800 rounded-lg hover:bg-stone-900 text-stone-400 hover:text-white"
              >
                {isMuted ? <VolumeX /> : <Volume2 />}
              </button>
              <button 
                onClick={goBack} 
                className="text-xs text-stone-400 hover:text-white px-3 py-2 border border-stone-800 rounded-lg font-mono hover:bg-stone-900 transition-colors"
              >
                QUIT HOSTING
              </button>
            </div>
          </header>

          <main className="z-10 my-8 flex-1 flex flex-col justify-center">
            {gameState?.status === 'setup' && (
              <div className="max-w-4xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
                <div className="space-y-6">
                  <span className="text-xs font-mono text-amber-500 tracking-widest uppercase">Step 01 / Pre-Game Setup</span>
                  <h2 className="text-4xl font-light text-white leading-tight font-serif">
                    Configure Your <br />
                    <span className="font-semibold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-amber-400 to-amber-600">Studio Cast</span>
                  </h2>
                  <p className="text-stone-400 text-sm leading-relaxed">
                    Register the names of your active studio members (designers, directors, developers). This constructs the multi-choice voting lists on players' phone controllers for the "Most Likely To" rounds.
                  </p>

                  <div className="bg-stone-900 border border-stone-800 p-5 rounded-2xl space-y-4">
                    <div className="flex gap-2">
                      <input 
                        type="text" 
                        placeholder="e.g. Rachel" 
                        value={newMemberName} 
                        onChange={e => setNewMemberName(e.target.value)}
                        onKeyDown={e => e.key === 'Enter' && handleAddMember()}
                        className="flex-1 bg-stone-950 border border-stone-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500"
                      />
                      <button 
                        onClick={handleAddMember}
                        className="bg-amber-500 hover:bg-amber-600 text-stone-950 px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-1.5 transition-colors"
                      >
                        <Plus /> Add
                      </button>
                    </div>

                    <div className="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2">
                      {customMembers.map((name, idx) => (
                        <span 
                          key={idx} 
                          className="inline-flex items-center gap-1.5 px-3 py-1 bg-stone-950 text-amber-400 text-xs font-mono rounded-lg border border-amber-500/10"
                        >
                          {name}
                          <button onClick={() => handleRemoveMember(name)} className="text-stone-500 hover:text-red-400 transition-colors">
                            <Trash2 />
                          </button>
                        </span>
                      ))}
                      {customMembers.length === 0 && (
                        <p className="text-xs text-stone-500 italic py-2">Roster is empty. Add your studio members above to populate the "Most Likely To" options!</p>
                      )}
                    </div>
                  </div>

                  <button 
                    onClick={createLobby}
                    disabled={customMembers.length === 0}
                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 disabled:opacity-40 disabled:pointer-events-none hover:from-amber-600 hover:to-amber-700 text-stone-950 font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-lg font-serif"
                  >
                    Create Game Lobby <ChevronRight />
                  </button>
                </div>

                <div className="hidden lg:block bg-stone-900/50 border border-stone-800 p-8 rounded-3xl relative overflow-hidden">
                  <div className="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 rounded-full filter blur-2xl" />
                  <h3 className="text-lg font-serif font-semibold text-amber-500 mb-4 uppercase tracking-widest">Quiz Highlights</h3>
                  <ul className="space-y-4 text-xs text-stone-300">
                    <li className="flex gap-3">
                      <div className="p-1 bg-amber-500/10 rounded text-amber-500 h-fit"><Info /></div>
                      <p><strong>15 Project Trivia:</strong> High-end questions detailing iconic materials, geometric fixtures, and spatial storytelling of Joyce Wang design masterpieces.</p>
                    </li>
                    <li className="flex gap-3">
                      <div className="p-1 bg-amber-500/10 rounded text-amber-500 h-fit"><Users /></div>
                      <p><strong>15 Peer Votes:</strong> Dynamic voting targeting customized member names. Tally calculates majority consensus in real-time!</p>
                    </li>
                  </ul>
                </div>
              </div>
            )}

            {gameState?.status === 'lobby' && (
              <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">
                <div className="lg:col-span-5 flex flex-col items-center text-center bg-stone-900 border border-stone-800 p-6 rounded-3xl relative">
                  <div className="absolute top-3 left-3 bg-amber-500/10 border border-amber-500/20 text-amber-400 px-3 py-1 rounded-lg text-[10px] font-mono uppercase tracking-wider">
                    JOIN PORTAL
                  </div>

                  <div className="bg-white p-4 rounded-2xl shadow-2xl mt-4 border border-stone-700">
                    <img 
                      src={qrCodeUrl} 
                      alt="Scan to join" 
                      className="w-56 h-56 md:w-64 md:h-64 object-contain"
                    />
                  </div>

                  <div className="mt-6 w-full space-y-3">
                    <p className="text-xs font-mono text-stone-400 uppercase tracking-widest">Scan QR or browse to:</p>
                    
                    <div className="bg-stone-950 p-3 rounded-xl border border-stone-800 space-y-2 text-left">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-mono text-amber-500 tracking-wider">CONNECT URL</span>
                        <button 
                          onClick={() => setShowOverrideInput(!showOverrideInput)}
                          className="text-[10px] text-stone-400 hover:text-amber-400 flex items-center gap-1 font-mono uppercase"
                        >
                          <Edit2 /> {showOverrideInput ? "Close Edit" : "Edit Link"}
                        </button>
                      </div>

                      {showOverrideInput ? (
                        <div className="space-y-2">
                          <p className="text-[10px] text-stone-500 leading-tight">Paste your public web app preview link here to regenerate the QR code dynamically:</p>
                          <input 
                            type="text"
                            value={joinLinkOverride}
                            placeholder={rawJoinUrl}
                            onChange={(e) => setJoinLinkOverride(e.target.value)}
                            className="w-full bg-stone-900 border border-stone-700 rounded px-2.5 py-1.5 text-xs text-white focus:outline-none"
                          />
                        </div>
                      ) : (
                        <p className="text-xs font-semibold text-amber-500 font-mono select-all truncate">
                          {joinUrl}
                        </p>
                      )}
                    </div>
                  </div>
                </div>

                <div className="lg:col-span-7 space-y-6">
                  <div className="flex justify-between items-end">
                    <div>
                      <span className="text-xs font-mono text-amber-500 tracking-widest uppercase">Live Lobby Status</span>
                      <h2 className="text-3xl font-serif font-light text-white mt-1">Waiting for Designers...</h2>
                    </div>
                    <div className="bg-stone-900 border border-stone-800 px-4 py-2 rounded-xl text-right">
                      <span className="text-xs text-stone-500 font-mono block">PLAYERS READY</span>
                      <span className="text-2xl font-bold text-amber-500 font-mono">{players.length}</span>
                    </div>
                  </div>

                  <div className="bg-stone-900/40 border border-stone-800/80 rounded-2xl p-6 min-h-[16rem] max-h-[18rem] overflow-y-auto">
                    {players.length === 0 ? (
                      <div className="h-full flex flex-col justify-center items-center text-stone-500 gap-3 py-12">
                        <UserPlus />
                        <p className="text-sm font-mono tracking-wider">Waiting for teammates to connect...</p>
                      </div>
                    ) : (
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {players.map((p, idx) => (
                          <div 
                            key={idx} 
                            className="flex items-center gap-2.5 bg-stone-950 border border-stone-800 p-3.5 rounded-xl shadow-md transform hover:-translate-y-0.5 transition-all"
                          >
                            <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping" />
                            <span className="text-xs font-bold text-stone-200 truncate font-mono uppercase tracking-wider">{p.name}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="flex gap-4">
                    <button 
                      onClick={clearPlayers}
                      className="px-6 py-4 border border-red-500/20 text-red-400 hover:bg-red-950/20 rounded-xl text-sm font-mono tracking-wider transition-colors"
                    >
                      CLEAR ROSTER
                    </button>
                    <button 
                      onClick={startGame}
                      disabled={players.length === 0}
                      className="flex-1 bg-amber-500 hover:bg-amber-600 disabled:opacity-50 disabled:hover:bg-amber-500 text-stone-950 font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-md tracking-wider uppercase font-serif"
                    >
                      <Play /> Start Studio Battle
                    </button>
                  </div>
                </div>
              </div>
            )}

            {gameState?.status === 'playing' && (() => {
              const qIndex = gameState?.currentQuestionIndex ?? 0;
              const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
              const answeredCount = players.filter(p => p.currentAnswer !== undefined && p.currentAnswer !== "").length;

              return (
                <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-stretch">
                  <div className="lg:col-span-7 flex flex-col justify-between space-y-6">
                    <div>
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-mono text-amber-500 tracking-widest uppercase bg-amber-950/20 border border-amber-500/20 px-3 py-1 rounded-full">
                          QUESTION {qIndex + 1} OF 30
                        </span>
                        <span className={`text-xs font-mono px-3 py-1 rounded-full border ${q.type === 'project' ? 'border-indigo-500/20 text-indigo-400 bg-indigo-950/20' : 'border-emerald-500/20 text-emerald-400 bg-emerald-950/20'}`}>
                          {q.type === 'project' ? 'STUDIO MASTERPIECE TRIVIA' : 'STUDIO PEOPLE POLL'}
                        </span>
                      </div>
                      <h2 className="text-2xl md:text-4xl font-serif text-white leading-snug mt-4">
                        {q.type === 'project' ? q.question : `Who is most likely ${q.prompt}`}
                      </h2>
                    </div>

                    {q.type === 'project' ? (
                      <ProjectIllustration type={q.svgType} />
                    ) : (
                      <div className="w-full h-48 md:h-64 rounded-xl flex flex-col items-center justify-center bg-stone-900 border border-emerald-500/20 relative overflow-hidden">
                        <Users />
                        <span className="text-xs font-mono text-emerald-400 uppercase tracking-widest">Office Consensus Voting Active</span>
                        <p className="text-stone-500 text-xs mt-2 max-w-sm text-center">Players choose custom designers. Aligning with the majority counts as consensus and wins massive score!</p>
                      </div>
                    )}

                    <div className="flex items-center justify-between bg-stone-900/80 border border-stone-800 p-4 rounded-xl">
                      <div className="flex items-center gap-3">
                        <div className="w-3.5 h-3.5 rounded-full bg-amber-500 animate-pulse" />
                        <span className="text-xs font-mono text-stone-300">
                          SUBMISSIONS: <strong className="text-amber-400 text-sm">{answeredCount}</strong> OF <strong className="text-stone-400 text-sm">{players.length}</strong>
                        </span>
                      </div>

                      <button 
                        onClick={revealAnswers}
                        className="bg-amber-500 hover:bg-amber-600 text-stone-950 px-4 py-2 rounded-lg text-xs font-mono font-bold tracking-widest uppercase transition-all"
                      >
                        REVEAL NOW
                      </button>
                    </div>
                  </div>

                  <div className="lg:col-span-5 flex flex-col justify-between bg-stone-900/50 border border-stone-800/80 p-8 rounded-3xl relative">
                    <div className="flex flex-col items-center justify-center my-6">
                      <div className="relative w-32 h-32 flex items-center justify-center">
                        <svg className="absolute inset-0 w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                          <circle cx="50" cy="50" r="45" fill="none" stroke="#262524" strokeWidth="6" />
                          <circle 
                            cx="50" 
                            cy="50" 
                            r="45" 
                            fill="none" 
                            stroke="#f59e0b" 
                            strokeWidth="6" 
                            strokeDasharray="283"
                            strokeDashoffset={283 - (283 * timerLeft) / 25}
                            className="transition-all duration-1000 ease-linear"
                          />
                        </svg>
                        <div className="text-center">
                          <span className="text-4xl font-mono font-bold text-white">{timerLeft}</span>
                          <span className="block text-[9px] font-mono text-stone-500 uppercase tracking-widest">SECONDS</span>
                        </div>
                      </div>
                    </div>

                    <div className="space-y-3 mt-4">
                      {q.type === 'project' ? (
                        q.options.map((opt, idx) => {
                          const labels = ['A', 'B', 'C', 'D'];
                          return (
                            <div key={idx} className="flex items-center gap-3 bg-stone-950 border border-stone-800 p-4 rounded-xl">
                              <span className="w-7 h-7 flex items-center justify-center bg-stone-900 border border-stone-800 text-amber-500 font-mono rounded-lg text-xs font-semibold">{labels[idx]}</span>
                              <span className="text-sm font-semibold text-stone-200">{opt}</span>
                            </div>
                          );
                        })
                      ) : (
                        <div className="p-4 bg-stone-950 border border-stone-800 rounded-xl text-center">
                          <p className="text-xs text-emerald-400 font-mono tracking-widest uppercase mb-2">DYNAMIC VOTE LIST</p>
                          <p className="text-stone-500 text-xs">Registered studio members are populated dynamically on players' screens.</p>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })()}

            {gameState?.status === 'showing_answer' && (() => {
              const qIndex = gameState?.currentQuestionIndex ?? 0;
              const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
              
              const voteStats = {};
              players.forEach(p => {
                if (p.currentAnswer) {
                  voteStats[p.currentAnswer] = (voteStats[p.currentAnswer] || 0) + 1;
                }
              });

              return (
                <div className="max-w-5xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-stretch">
                  <div className="lg:col-span-7 flex flex-col justify-between space-y-6">
                    <div>
                      <span className="text-xs font-mono text-emerald-400 tracking-widest uppercase bg-emerald-950/20 border border-emerald-500/20 px-3 py-1 rounded-full">
                        REVEAL & EXPLANATION
                      </span>
                      {q.type === 'project' ? (
                        <div className="space-y-2 mt-4">
                          <span className="text-xs text-stone-500 font-mono uppercase block">CORRECT ANSWER IS:</span>
                          <h2 className="text-4xl font-bold font-serif text-amber-400">{q.answer}</h2>
                          <p className="text-stone-300 text-sm leading-relaxed mt-4 bg-stone-900/50 border border-stone-800 p-4 rounded-xl">
                            {q.explanation}
                          </p>
                        </div>
                      ) : (
                        <div className="space-y-2 mt-4">
                          <span className="text-xs text-stone-500 font-mono uppercase block">THE STUDIO DECLARES:</span>
                          <h2 className="text-3xl font-bold font-serif text-emerald-400 leading-snug">
                            {Object.keys(voteStats).length > 0 
                              ? `Consensus Winner: ${Object.entries(voteStats).sort((a,b)=>b[1]-a[1])[0][0]}`
                              : "No consensus. No votes recorded!"}
                          </h2>
                          <p className="text-stone-400 text-xs mt-1">Everyone voting for the majority consensus scores an extra 120 points!</p>
                        </div>
                      )}
                    </div>

                    {q.type === 'project' && <ProjectIllustration type={q.svgType} />}
                  </div>

                  <div className="lg:col-span-5 flex flex-col justify-between bg-stone-900/50 border border-stone-800/80 p-8 rounded-3xl">
                    <div>
                      <h3 className="text-md font-serif text-white tracking-wider mb-6 uppercase border-b border-stone-800 pb-2">Response Breakdown</h3>
                      
                      <div className="space-y-4">
                        {q.type === 'project' ? (
                          q.options.map((opt, idx) => {
                            const count = players.filter(p => p.currentAnswer === opt).length;
                            const percentage = players.length > 0 ? (count / players.length) * 100 : 0;
                            const isCorrect = opt === q.answer;

                            return (
                              <div key={idx} className="space-y-1">
                                <div className="flex justify-between text-xs font-mono">
                                  <span className={isCorrect ? 'text-amber-400 font-bold' : 'text-stone-400'}>
                                    {opt} {isCorrect && '✓'}
                                  </span>
                                  <span className="text-stone-300">{count} ({Math.round(percentage)}%)</span>
                                </div>
                                <div className="w-full bg-stone-950 h-2 rounded-full overflow-hidden border border-stone-800">
                                  <div 
                                    className={`h-full rounded-full transition-all duration-1000 ${isCorrect ? 'bg-amber-500' : 'bg-stone-700'}`}
                                    style={{ width: `${percentage}%` }}
                                  />
                                </div>
                              </div>
                            );
                          })
                        ) : (
                          Object.keys(voteStats).length > 0 ? (
                            Object.entries(voteStats).sort((a,b) => b[1] - a[1]).map(([name, count], idx) => {
                              const percentage = players.length > 0 ? (count / players.length) * 100 : 0;
                              return (
                                <div key={idx} className="space-y-1">
                                  <div className="flex justify-between text-xs font-mono">
                                    <span className="text-stone-200 font-medium">{name}</span>
                                    <span className="text-emerald-400">{count} votes ({Math.round(percentage)}%)</span>
                                  </div>
                                  <div className="w-full bg-stone-950 h-2 rounded-full overflow-hidden border border-stone-800">
                                    <div 
                                      className="h-full rounded-full bg-emerald-500 transition-all duration-1000"
                                      style={{ width: `${percentage}%` }}
                                    />
                                  </div>
                                </div>
                              );
                            })
                          ) : (
                            <p className="text-xs text-stone-500 italic text-center py-6">No answers submitted.</p>
                          )
                        )}
                      </div>
                    </div>

                    <button 
                      onClick={nextQuestion}
                      className="w-full bg-amber-500 hover:bg-amber-600 text-stone-950 font-bold py-4 rounded-xl mt-8 transition-all flex items-center justify-center gap-2 text-sm tracking-widest uppercase font-serif"
                    >
                      {qIndex + 1 < QUIZ_QUESTIONS.length ? 'Next Question' : 'Show Podium Finalists'} <ChevronRight />
                    </button>
                  </div>
                </div>
              );
            })()}

            {gameState?.status === 'leaderboard' && (() => {
              const rankedPlayers = [...players].sort((a, b) => (b.score || 0) - (a.score || 0));
              const gold = rankedPlayers[0];
              const silver = rankedPlayers[1];
              const bronze = rankedPlayers[2];

              return (
                <div className="max-w-4xl mx-auto w-full space-y-12">
                  <div className="text-center space-y-2">
                    <span className="text-xs font-mono text-amber-500 tracking-widest uppercase">CONGRATULATIONS ARCHITECTS</span>
                    <h2 className="text-5xl font-serif font-light text-white leading-tight">THE GRAND PODIUM</h2>
                    <p className="text-stone-400 text-sm">Honoring high-design mastery and studio intuition.</p>
                  </div>

                  <div className="flex items-end justify-center gap-4 pt-16 border-b border-stone-800 pb-8">
                    {silver && (
                      <div className="flex flex-col items-center">
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-stone-300 block max-w-28 truncate">{silver.name}</span>
                          <span className="text-xs text-stone-500 font-mono">{silver.score || 0} pts</span>
                        </div>
                        <div className="w-28 bg-gradient-to-t from-stone-900 to-stone-800 h-32 rounded-t-xl flex flex-col items-center justify-center border-t border-stone-600">
                          <span className="text-4xl font-extrabold text-stone-400">2</span>
                          <span className="text-[10px] text-stone-500 font-mono uppercase tracking-widest">SILVER</span>
                        </div>
                      </div>
                    )}

                    {gold && (
                      <div className="flex flex-col items-center scale-110 -translate-y-4">
                        <Award />
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-amber-300 block max-w-28 truncate">{gold.name}</span>
                          <span className="text-xs text-amber-400 font-mono font-bold">{gold.score || 0} pts</span>
                        </div>
                        <div className="w-32 bg-gradient-to-t from-stone-900 to-stone-800 h-44 rounded-t-xl flex flex-col items-center justify-center border-t-2 border-amber-500 relative shadow-2xl shadow-amber-950/20">
                          <span className="text-5xl font-black text-amber-500">1</span>
                          <span className="text-[10px] text-amber-400 font-mono uppercase tracking-widest">GOLD</span>
                        </div>
                      </div>
                    )}

                    {bronze && (
                      <div className="flex flex-col items-center">
                        <div className="text-center mb-2">
                          <span className="text-sm font-bold font-mono text-orange-300 block max-w-28 truncate">{bronze.name}</span>
                          <span className="text-xs text-stone-500 font-mono">{bronze.score || 0} pts</span>
                        </div>
                        <div className="w-28 bg-gradient-to-t from-stone-900 to-stone-800 h-24 rounded-t-xl flex flex-col items-center justify-center border-t border-orange-700/50">
                          <span className="text-3xl font-extrabold text-orange-600">3</span>
                          <span className="text-[10px] text-stone-500 font-mono uppercase tracking-widest">BRONZE</span>
                        </div>
                      </div>
                    )}
                  </div>

                  <div className="max-w-2xl mx-auto space-y-2 max-h-48 overflow-y-auto pr-2">
                    {rankedPlayers.slice(3).map((p, idx) => (
                      <div key={idx} className="flex justify-between items-center bg-stone-900/60 border border-stone-800/80 px-5 py-3 rounded-xl">
                        <div className="flex items-center gap-3">
                          <span className="text-xs font-mono text-stone-500">#{idx + 4}</span>
                          <span className="text-sm font-bold text-stone-200 font-mono uppercase">{p.name}</span>
                        </div>
                        <span className="text-xs font-mono text-amber-500">{p.score || 0} PTS</span>
                      </div>
                    ))}
                  </div>

                  <div className="text-center">
                    <button 
                      onClick={resetGameToSetup}
                      className="bg-stone-900 border border-stone-800 hover:bg-stone-800 hover:border-amber-500/20 px-8 py-3.5 rounded-xl text-xs font-mono tracking-widest uppercase transition-colors"
                    >
                      RESET & FRESH RESTART
                    </button>
                  </div>
                </div>
              );
            })()}
          </main>

          <footer className="z-10 border-t border-stone-900 pt-4 flex justify-between items-center text-xs text-stone-500">
            <p>Joyce Wang Studio Realtime Event Service • v2.2</p>
            {gameState?.status !== 'setup' && (
              <p className="font-mono text-amber-500 font-semibold">SESSION ID: {appId}</p>
            )}
          </footer>
        </div>
      );
    }

    // ==========================================
    // 3. PLAYER CONTROLLER SCREEN (MOBILE CONTROLLER)
    // ==========================================
    function PlayerScreen({ user, isMuted, setIsMuted, goBack }) {
      const [playerId, setPlayerId] = useState(null);
      const [playerName, setPlayerName] = useState("");
      const [joined, setJoined] = useState(false);
      const [myPlayerDoc, setMyPlayerDoc] = useState(null);
      const [gameState, setGameState] = useState(null);
      const [submitting, setSubmitting] = useState(false);

      const gameDocRef = db.doc(`artifacts/${appId}/public/data/games/lobby`);

      useEffect(() => {
        if (!user) return;
        setPlayerId(user.uid);

        const unsubGame = gameDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setGameState(snapshot.data());
          }
        }, (err) => {
          console.error("Player lobby sync error:", err);
        });

        return () => unsubGame();
      }, [user]);

      useEffect(() => {
        if (!user || !playerId) return;

        const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
        const unsubMyPlayer = myDocRef.onSnapshot((snapshot) => {
          if (snapshot.exists) {
            setMyPlayerDoc(snapshot.data());
            setJoined(true);
          } else {
            setJoined(false);
          }
        });

        return () => unsubMyPlayer();
      }, [user, playerId]);

      const handleJoinGame = async (e) => {
        e.preventDefault();
        if (!playerName.trim() || !playerId) return;

        setSubmitting(true);
        sfx.playJoin();

        try {
          const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
          await myDocRef.set({
            name: playerName.trim().toUpperCase(),
            score: 0,
            currentAnswer: "",
            joinedAt: Date.now()
          });
          setJoined(true);
        } catch (err) {
          console.error("Error writing player doc:", err);
        } finally {
          setSubmitting(false);
        }
      };

      const selectOption = async (optValue) => {
        if (!playerId || !gameState || myPlayerDoc?.currentAnswer) return;

        sfx.playSuccess();
        try {
          const myDocRef = db.doc(`artifacts/${appId}/public/data/players/${playerId}`);
          await myDocRef.update({
            currentAnswer: optValue,
            answeredAt: Date.now()
          });
        } catch (err) {
          console.error("Error submitting answer:", err);
        }
      };

      if (!gameState) {
        return (
          <div className="min-h-screen bg-stone-950 flex flex-col justify-center items-center text-stone-100 p-6">
            <RefreshCw className="w-8 h-8 text-amber-500 animate-spin mb-4" />
            <p className="text-sm font-mono tracking-widest text-stone-400 text-center">WAITING FOR HOST TO CONFIGURE LOBBY...</p>
          </div>
        );
      }

      if (!joined) {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_80%_80%_at_50%_50%,#1c1917_0%,transparent_100%)] opacity-40" />

            <header className="z-10 flex justify-between items-center border-b border-stone-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-1 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">Controller Screen</span>
              </div>
              <button onClick={goBack} className="text-[10px] text-stone-500 hover:text-white font-mono uppercase tracking-widest">
                Back
              </button>
            </header>

            <main className="z-10 flex-1 flex flex-col justify-center max-w-md mx-auto w-full py-12">
              <div className="space-y-6 text-center">
                <div className="w-16 h-16 bg-amber-500/10 border border-amber-500/30 text-amber-500 flex items-center justify-center rounded-2xl mx-auto">
                  <QrCodeIcon />
                </div>

                <div className="space-y-2">
                  <h2 className="text-3xl font-serif text-white">Join the Live Quiz</h2>
                  <p className="text-stone-400 text-xs">Enter your professional nickname or full name to represent yourself in the live design showdown.</p>
                </div>

                <form onSubmit={handleJoinGame} className="space-y-4 pt-4">
                  <div className="space-y-1.5 text-left">
                    <label className="text-[10px] font-mono text-amber-500 uppercase tracking-widest">NICKNAME / NAME</label>
                    <input 
                      type="text"
                      required
                      placeholder="e.g. SONAL W."
                      maxLength={15}
                      value={playerName}
                      onChange={e => setPlayerName(e.target.value)}
                      className="w-full bg-stone-900 border border-stone-700 rounded-xl px-4 py-3.5 text-sm text-white focus:outline-none focus:border-amber-500"
                    />
                  </div>

                  <button 
                    type="submit"
                    disabled={submitting || !playerName.trim()}
                    className="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-stone-950 font-bold py-4 rounded-xl transition-all shadow-lg hover:shadow-amber-500/10 flex items-center justify-center gap-2 font-serif text-xs tracking-widest"
                  >
                    {submitting ? 'Connecting...' : 'CONNECT CONTROLLER'} <ArrowRight />
                  </button>
                </form>
              </div>
            </main>

            <footer className="z-10 text-center text-[10px] text-stone-600">
              Joyce Wang Studio • Secure real-time mobile websocket endpoint
            </footer>
          </div>
        );
      }

      if (gameState?.status === 'lobby' || gameState?.status === 'setup') {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{myPlayerDoc?.name}</span>
              </div>
              <span className="text-[10px] text-emerald-500 bg-emerald-950/20 border border-emerald-500/20 px-2.5 py-0.5 rounded-full font-mono uppercase tracking-widest">
                CONNECTED
              </span>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto gap-4">
              <div className="w-16 h-16 bg-stone-900 border border-stone-800 rounded-2xl flex items-center justify-center text-amber-500 mx-auto animate-pulse">
                <Clock />
              </div>
              <h2 className="text-xl font-serif text-white font-semibold">You're Checked In!</h2>
              <p className="text-stone-400 text-xs">Keep your phone open. When the host commences the game, question answer options will instantly materialize below.</p>
              <div className="bg-stone-900/60 border border-stone-800 rounded-xl p-4 mt-4 text-left">
                <span className="text-[9px] font-mono text-stone-500 uppercase tracking-widest block mb-1">YOUR PROFILE</span>
                <div className="flex justify-between items-center text-xs">
                  <span className="text-stone-300 font-bold font-mono text-sm">{myPlayerDoc?.name}</span>
                  <span className="text-amber-500 font-mono">0 POINTS</span>
                </div>
              </div>
            </main>

            <footer className="text-center text-[10px] text-stone-600">
              Sync active on room: {appId}
            </footer>
          </div>
        );
      }

      if (gameState?.status === 'playing') {
        const qIndex = gameState?.currentQuestionIndex ?? 0;
        const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        const hasAnswered = myPlayerDoc?.currentAnswer !== "";

        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="text-xs font-mono font-bold text-amber-500 bg-amber-950/20 px-2 py-0.5 rounded border border-amber-500/10">Q-{q.id}</span>
                <span className="text-xs font-mono font-bold text-stone-300 truncate max-w-28 uppercase">{myPlayerDoc?.name}</span>
              </div>
              <div className="text-right">
                <span className="text-[9px] text-stone-500 font-mono block">SCORE</span>
                <span className="text-sm font-mono font-bold text-amber-500">{myPlayerDoc?.score || 0}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center py-6">
              {hasAnswered ? (
                <div className="text-center space-y-4 max-w-sm mx-auto">
                  <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto animate-bounce">
                    <CheckCircle />
                  </div>
                  <h3 className="text-xl font-bold text-white font-serif">Answer Locked In!</h3>
                  <p className="text-xs text-stone-400">Your selection has been successfully committed to the studio cloud database. Await the host's review!</p>
                  
                  <div className="p-4 bg-stone-900 border border-stone-800 rounded-xl text-left">
                    <span className="text-[9px] font-mono text-stone-500 uppercase tracking-widest block mb-1">YOUR LOCKED SELECTION</span>
                    <span className="text-sm font-bold text-amber-500 font-mono">{myPlayerDoc.currentAnswer}</span>
                  </div>
                </div>
              ) : (
                <div className="space-y-6">
                  <div className="text-center">
                    <span className="text-xs text-amber-500 font-mono tracking-widest uppercase block mb-1">CHOOSE YOUR ANSWER</span>
                    <p className="text-stone-300 text-sm font-medium">Select correct project option or vote for a colleague:</p>
                  </div>

                  {q.type === 'project' ? (
                    <div className="grid grid-cols-1 gap-3 max-w-md mx-auto">
                      {q.options.map((opt, idx) => {
                        const letters = ['A', 'B', 'C', 'D'];
                        return (
                          <button 
                            key={idx}
                            onClick={() => selectOption(opt)}
                            className="w-full text-left flex items-center gap-4 bg-stone-900 hover:bg-stone-800 border border-stone-800 hover:border-amber-500/40 p-4 rounded-xl transition-all active:scale-95 duration-100"
                          >
                            <span className="w-8 h-8 flex items-center justify-center bg-stone-950 border border-stone-800 text-amber-500 rounded-lg text-xs font-bold font-mono">
                              {letters[idx]}
                            </span>
                            <span className="text-sm font-bold text-stone-200">{opt}</span>
                          </button>
                        );
                      })}
                    </div>
                  ) : (
                    <div className="space-y-3 max-w-md mx-auto">
                      <span className="text-[10px] text-emerald-400 font-mono uppercase tracking-widest block text-center mb-1">SELECT STUDIO MEMBER:</span>
                      <div className="grid grid-cols-2 gap-2 max-h-72 overflow-y-auto pr-1">
                        {(gameState?.membersList || []).map((name, idx) => (
                          <button 
                            key={idx}
                            onClick={() => selectOption(name)}
                            className="bg-stone-900 hover:bg-stone-800 border border-stone-800 hover:border-emerald-500/30 p-3.5 rounded-xl text-xs font-bold font-mono text-stone-300 hover:text-emerald-400 text-center truncate uppercase tracking-wider active:scale-95 duration-100"
                          >
                            {name}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}
                </div>
              )}
            </main>

            <footer className="text-center text-[10px] text-stone-600">
              Watch main presenter screen for correct answers!
            </footer>
          </div>
        );
      }

      if (gameState?.status === 'showing_answer') {
        const qIndex = gameState?.currentQuestionIndex ?? 0;
        const q = QUIZ_QUESTIONS[qIndex] || QUIZ_QUESTIONS[0];
        const isCorrect = q.type === 'project' && myPlayerDoc?.currentAnswer === q.answer;

        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{myPlayerDoc?.name}</span>
              </div>
              <div className="text-right">
                <span className="text-[9px] text-stone-500 font-mono block">LATEST SCORE</span>
                <span className="text-sm font-mono font-bold text-amber-500">{myPlayerDoc?.score || 0}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto space-y-6">
              {q.type === 'project' ? (
                isCorrect ? (
                  <div className="space-y-4">
                    <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto">
                      <Trophy />
                    </div>
                    <h2 className="text-2xl font-serif text-emerald-400 font-bold">CORRECT GUESS!</h2>
                    <p className="text-xs text-stone-300">You earned points for this speed evaluation of Joyce Wang designs.</p>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="w-16 h-16 bg-red-500/10 border border-red-500/30 text-red-500 flex items-center justify-center rounded-2xl mx-auto">
                      <Info />
                    </div>
                    <h2 className="text-2xl font-serif text-red-400 font-bold">INCORRECT GUESS</h2>
                    <p className="text-xs text-stone-400">The correct design project was <strong className="text-amber-500">{q.answer}</strong>.</p>
                  </div>
                )
              ) : (
                <div className="space-y-4">
                  <div className="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 text-emerald-500 flex items-center justify-center rounded-2xl mx-auto">
                    <Users />
                  </div>
                  <h2 className="text-2xl font-serif text-emerald-400 font-bold">VOTE TABULATED!</h2>
                  <p className="text-xs text-stone-300">If your choice aligned with the majority of the studio, you gained bonus consensus points!</p>
                </div>
              )}

              <div className="bg-stone-900 border border-stone-800 rounded-2xl p-5 text-left space-y-3">
                <div className="flex justify-between items-center text-xs">
                  <span className="text-stone-400 font-mono uppercase">YOUR SUBMISSION:</span>
                  <span className="text-white font-bold font-mono">{myPlayerDoc?.currentAnswer || "N/A"}</span>
                </div>
                {q.type === 'project' && (
                  <div className="flex justify-between items-center text-xs pt-2 border-t border-stone-800">
                    <span className="text-stone-400 font-mono uppercase">CORRECT PROJECT:</span>
                    <span className="text-amber-500 font-bold font-mono">{q.answer}</span>
                  </div>
                )}
              </div>
            </main>

            <footer className="text-center text-[10px] text-stone-600">
              Prepare for the next question on the live screen!
            </footer>
          </div>
        );
      }

      if (gameState?.status === 'leaderboard') {
        return (
          <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col justify-between p-6 font-sans relative">
            <header className="flex justify-between items-center border-b border-stone-800 pb-4">
              <div className="flex items-center gap-2">
                <span className="bg-amber-500 text-stone-950 font-bold px-2 py-0.5 rounded text-xs font-serif">JW</span>
                <span className="text-xs font-serif font-bold text-white uppercase tracking-wider">{myPlayerDoc?.name}</span>
              </div>
            </header>

            <main className="flex-1 flex flex-col justify-center text-center max-w-sm mx-auto space-y-4">
              <div className="w-16 h-16 bg-gradient-to-br from-amber-400 to-amber-600 text-stone-950 flex items-center justify-center rounded-2xl mx-auto shadow-lg shadow-amber-500/10">
                <Award />
              </div>
              <h2 className="text-2xl font-serif text-white font-bold">QUIZ COMPLETED!</h2>
              <p className="text-xs text-stone-400">Thanks for participating! Look up at the podium presentation screen to locate your overall designer rank!</p>

              <div className="bg-stone-900 border border-stone-800 rounded-2xl p-5 text-left">
                <span className="text-[9px] font-mono text-stone-500 uppercase tracking-widest block mb-1">YOUR FINAL RECORD</span>
                <div className="flex justify-between items-center text-sm">
                  <span className="text-stone-300 font-bold font-mono">{myPlayerDoc?.name}</span>
                  <span className="text-amber-500 font-bold font-mono text-lg">{myPlayerDoc?.score || 0} PTS</span>
                </div>
              </div>
            </main>

            <footer className="text-center text-[10px] text-stone-600">
              Joyce Wang Studio • Creative Office Culture Solutions
            </footer>
          </div>
        );
      }

      return null;
    }

    // Mount React App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
